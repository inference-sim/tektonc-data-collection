apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: __PIPELINE_RUN_NAME__
spec:
  timeouts:
    pipeline: 6h
    tasks: 5h30m
  taskRunTemplate:
    serviceAccountName: helm-installer
  pipelineRef:
    name: blis-exp1-saturation-meta-llama-llama-3-1-8b-instruct
  params:
    - name: experimentId
      value: "exp1-saturation"
    - name: model
      value: "meta-llama/Llama-3.1-8B-Instruct"
    - name: namespace
      value: "diya"
  workspaces:
    - name: model-cache
      persistentVolumeClaim:
        claimName: model-pvc
    - name: data
      persistentVolumeClaim:
        claimName: data-pvc
    - name: hf-credentials
      secret:
        secretName: hf-secret
        items:
          - key: HF_TOKEN
            path: HF_TOKEN
    - name: target-credentials
      secret:
        secretName: s3-secret
        items:
          - key: ACCESS_KEY
            path: ACCESS_KEY
          - key: SECRET_KEY
            path: SECRET_KEY
