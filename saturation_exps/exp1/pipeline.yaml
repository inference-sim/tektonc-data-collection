apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: blis-1-llama-3-1-8b-instruct
spec:
  description: Saturation Exp
  workspaces:
  - name: model-cache
    description: Location where models are stored; shared by multiple model servers
  - name: hf-credentials
    description: Secret workspace containing a HuggingFace token
  - name: data
    description: Cache of results and BLIS binary
  - name: target-credentials
    description: Secret workspace containing upload target credentials. For example, AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for s3.
  params:
  - name: experimentId
    type: string
    description: Identifier for experiment execution
  - name: model
    type: string
    description: the model to be deployed
  - name: namespace
    type: string
    description: Kubernetes namespace where workload will execute
  tasks:
  - name: download-model
    taskRef:
      name: download-model
    workspaces:
    - name: model-cache
    - name: hf-credentials
    params:
    - name: model
      value: $(params.model)
  - name: install-blis
    taskRef:
      name: install-blis
    runAfter:
    - download-model
    workspaces:
    - name: data
  - name: create-exp-config-1-1
    taskRef:
      name: create-exp-config
    runAfter:
    - install-blis
    workspaces:
    - name: data
    params:
    - name: model
      value: $(params.model)
    - name: tp
      value: '1'
    - name: dlp
      value: '1'
    - name: max_model_len
      value: '8192'
    - name: max_num_batched_tokens
      value: '2048'
    - name: max_num_seqs
      value: '128'
    - name: block_size
      value: '16'
    - name: kv_offloading_size
      value: '0'
    - name: app
      value: blis-orc
    - name: results_dir
      value: $(params.experimentId)-1-1
  - name: deploy-model-1-1
    description: Deploy model engines. Uses the modelservice helm chart. The task implementation automatically overrides "modelArtifacts.name", "modelArtifacts.uri" "modelArtifacts.labels."llm-d.ai/model", and "fullnameOverride" to avoid conflicts and ensure consistency.
    taskRef:
      name: deploy-model
    runAfter:
    - install-blis
    workspaces:
    - name: model-cache
    params:
    - name: model
      value: $(params.model)
    - name: modelLabel
      value: $(params.experimentId)-1-1
    - name: namespace
      value: $(params.namespace)
    - name: config
      value:
        fullnameOverride: FULLNAME
        serviceAccountOverride: default
        multinode: false
        modelArtifacts:
          uri: pvc://model-pvc/models/MODEL
          size: 300Gi
          authSecretName: hf-secret
          name: MODEL
          labels:
            llm-d.ai/inferenceServing: 'true'
            llm-d.ai/model: FULLNAME
        routing:
          servicePort: 8000
          proxy:
            enabled: false
        prefill:
          create: false
        decode:
          create: true
          replicas: 1
          acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
            - NVIDIA-H100-80GB-HBM3
          containers:
          - name: vllm
            env:
            - name: VLLM_CONFIGURE_LOGGING
              value: '1'
            - name: VLLM_LOGGING_CONFIG_PATH
              value: /workspace/vllm_logging.json
            - name: HF_HOME
              value: /mnt/exp/.cache/huggingface
            - name: TRANSFORMERS_CACHE
              value: /mnt/exp/.cache/huggingface
            mountModelVolume: true
            image: vllm/vllm-openai:v0.19.1
            modelCommand: vllmServe
            resources:
              limits:
                memory: 128Gi
                cpu: '32'
              requests:
                memory: 128Gi
                cpu: '32'
            extraConfig:
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                failureThreshold: 60
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 5
              livenessProbe:
                tcpSocket:
                  port: 8000
                failureThreshold: 3
                periodSeconds: 5
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
                failureThreshold: 3
                periodSeconds: 5
            volumeMounts:
            - name: data
              mountPath: /mnt/exp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data-pvc
          annotations:
            gpu-reaper.io/exclude: 'true'
    - name: overrides
      value:
      - decode.parallelism.tensor=1
      - decode.parallelism.data=1
      - decode.parallelism.dataLocal=1
      - decode.containers[name="vllm"].args=--data-parallel-size=1
      - decode.containers[name="vllm"].args=--max-model-len=8192
      - decode.containers[name="vllm"].args=--max-num-batched-tokens=2048
      - decode.containers[name="vllm"].args=--max-num-seqs=128
      - decode.containers[name="vllm"].env[name="VLLM_LOGGING_CONFIG_PATH"].value="/mnt/exp/$(params.experimentId)-1-1/vllm_logging.json"
      - decode.containers[name="vllm"].args=--scheduling-policy=priority
  - name: orc-observe-1-1
    description: Run BLIS observe phase to collect real request traces.
    taskRef:
      name: orc-observe
    runAfter:
    - deploy-model-1-1
    timeout: 350m
    retries: 3
    workspaces:
    - name: data
    - name: hf-credentials
    params:
    - name: model
      value: $(params.model)
    - name: modelLabel
      value: $(params.experimentId)-1-1
    - name: results_dir
      value: $(params.experimentId)-1-1
    - name: workloadSpec
      value:
        version: '2'
        seed: 42
        category: ''
        clients: []
        cohorts:
        - id: afternoon-background
          population: 1
          slo_class: background
          arrival:
            process: poisson
          input_distribution:
            type: lognormal
            params:
              mu: 6.69621191290237
              sigma: 0.5902513998220089
          output_distribution:
            type: lognormal
            params:
              mu: 4.114017268596266
              sigma: 0.908969534506003
          streaming: true
          rate_fraction: 1
          spike:
            start_time_us: 0
            duration_us: 600000000
            trace_rate: 12.406919642857135
        - id: afternoon-batch
          population: 1
          slo_class: batch
          arrival:
            process: poisson
          input_distribution:
            type: lognormal
            params:
              mu: 6.607780910378171
              sigma: 0.8727319577006727
          output_distribution:
            type: lognormal
            params:
              mu: 4.096106531698332
              sigma: 1.2519617625757922
          streaming: true
          rate_fraction: 1
          spike:
            start_time_us: 0
            duration_us: 600000000
            trace_rate: 12.406919642857135
        - id: afternoon-critical
          population: 1
          slo_class: critical
          arrival:
            process: poisson
          input_distribution:
            type: lognormal
            params:
              mu: 6.582734044244264
              sigma: 0.5629375545724375
          output_distribution:
            type: lognormal
            params:
              mu: 4.624020180084728
              sigma: 0.8848836416915962
          streaming: true
          rate_fraction: 1
          spike:
            start_time_us: 0
            duration_us: 600000000
            trace_rate: 12.406919642857135
        - id: afternoon-sheddable
          population: 1
          slo_class: sheddable
          arrival:
            process: poisson
          input_distribution:
            type: lognormal
            params:
              mu: 6.4993704071213605
              sigma: 0.6893972829089396
          output_distribution:
            type: lognormal
            params:
              mu: 4.069653546012583
              sigma: 0.9474746650875042
          streaming: true
          rate_fraction: 1
          spike:
            start_time_us: 0
            duration_us: 600000000
            trace_rate: 12.406919642857135
        - id: afternoon-standard
          population: 1
          slo_class: standard
          arrival:
            process: poisson
          input_distribution:
            type: lognormal
            params:
              mu: 6.813289322036138
              sigma: 0.7095809961919253
          output_distribution:
            type: lognormal
            params:
              mu: 3.8889842819443703
              sigma: 0.928382494594449
          streaming: true
          rate_fraction: 1
          spike:
            start_time_us: 0
            duration_us: 600000000
            trace_rate: 12.406919642857135
        aggregate_rate: 0
    - name: horizon
      value: '600'
    - name: detectSaturation
      value: 'true'
  - name: delete-model-1-1
    description: Delete the model engine immediately after observe to release GPU.
    runAfter:
    - orc-observe-1-1
    taskRef:
      name: delete-model
    params:
    - name: namespace
      value: $(params.namespace)
    - name: modelLabel
      value: $(params.experimentId)-1-1
  - name: download-observe-data-1-1
    description: Validate observe data and signal it's ready for download. Replay/calibrate run locally after download.
    runAfter:
    - orc-observe-1-1
    taskRef:
      name: download-observe-data
    workspaces:
    - name: data
    params:
    - name: results_dir
      value: $(params.experimentId)-1-1
    - name: namespace
      value: $(params.namespace)
  finally:
  - name: finally-delete-model-1-1
    taskRef:
      name: delete-model
    params:
    - name: namespace
      value: $(params.namespace)
    - name: modelLabel
      value: $(params.experimentId)-1-1
