experiment:
  name: cal-a100

# A100-80GB calibration — 6 configs (12 GPUs total if parallel)
# Skipping Mixtral-8x22B (8 GPUs) to fit within 12 GPU limit
# All experiments use General workload baseline: mbt=2048, cpu_offload=false, gpu_mem=0.9
configs:
  - label: qwen3-14b-a100-tp1
    model_short: Qwen3-14B
    hf_id: "Qwen/Qwen3-14B"
    tp: 1
    extra_overrides: []

  - label: llama31-8b-a100-tp1
    model_short: Llama-3.1-8b
    hf_id: "meta-llama/Llama-3.1-8B-Instruct"
    tp: 1
    extra_overrides: []

  - label: codellama-34b-a100-tp2
    model_short: Codellama-34b
    hf_id: "codellama/CodeLlama-34b-Instruct-hf"
    tp: 2
    extra_overrides: []

  - label: llama2-70b-a100-tp4
    model_short: Llama-2-70b
    hf_id: "meta-llama/Llama-2-70b-hf"
    tp: 4
    extra_overrides: []

  - label: mixtral-8x7b-a100-tp2
    model_short: Mixtral-8x7B
    hf_id: "mistralai/Mixtral-8x7B-v0.1"
    tp: 2
    extra_overrides: []

  - label: scout-17b-a100-tp2
    model_short: Scout-17B-16E
    hf_id: "RedHatAI/Llama-4-Scout-17B-16E-Instruct-FP8-dynamic"
    tp: 2
    extra_overrides:
      # Pre-quantized FP8 checkpoint — no --quantization flag needed
      - 'decode.containers[name="vllm"].args=--override-generation-config={"attn_temperature_tuning": true}'

  # Mixtral-8x22B (8 GPUs) skipped to fit within 12 GPU limit
  # Run separately: exp 52

# Model deployment config — same base as H100 calibration
stack:
  MAX_MODEL_LEN: 4096
  MAX_NUM_BATCHED_TOKENS: 2048
  MAX_NUM_SEQS: 128

  model:
    helmValues:
      fullnameOverride: FULLNAME
      serviceAccountOverride: default
      multinode: false
      modelArtifacts:
        uri: pvc://model-pvc/models/MODEL
        size: 300Gi
        authSecretName: "hf-secret"
        name: MODEL
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: FULLNAME
      routing:
        servicePort: 8000
        proxy:
          enabled: false
      prefill:
        create: false
      decode:
        create: true
        replicas: 1
        acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
              - NVIDIA-A100-SXM4-80GB  # A100 SXM4 (matches cluster config)
        parallelism:
          data: 1
          tensor: 1
        containers:
        - name: "vllm"
          env:
            - name: HF_HOME
              value: "/mnt/exp/.cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/mnt/exp/.cache/huggingface"
          mountModelVolume: true
          image: "vllm/vllm-openai:v0.15.1"
          modelCommand: vllmServe
          resources:
            limits:
              memory: 128Gi
              cpu: "32"
            requests:
              memory: 128Gi
              cpu: "32"
          extraConfig:
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 60
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            livenessProbe:
              tcpSocket:
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
          volumeMounts:
          - name: data
            mountPath: /mnt/exp

        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
