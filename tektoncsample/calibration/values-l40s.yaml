experiment:
  name: cal-l40s

# L40S calibration — 2 configs (2 GPUs total if parallel)
# All experiments use General workload baseline: mbt=2048, cpu_offload=false, gpu_mem=0.9
# Mixtral-8x7B (TP=2) and Scout-17B-16E (TP=2) exceed L40S memory capacity
configs:
  - label: qwen3-14b-l40s-tp1
    model_short: Qwen3-14B
    hf_id: "Qwen/Qwen3-14B"
    tp: 1
    extra_overrides: []

  - label: llama31-8b-l40s-tp1
    model_short: Llama-3.1-8b
    hf_id: "meta-llama/Llama-3.1-8B-Instruct"
    tp: 1
    extra_overrides: []

# Model deployment config
stack:
  MAX_MODEL_LEN: 4096
  MAX_NUM_BATCHED_TOKENS: 2048
  MAX_NUM_SEQS: 128

  model:
    helmValues:
      fullnameOverride: FULLNAME
      serviceAccountOverride: default
      multinode: false
      modelArtifacts:
        uri: pvc://model-pvc/models/MODEL
        size: 300Gi
        authSecretName: "hf-secret"
        name: MODEL
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: FULLNAME
      routing:
        servicePort: 8000
        proxy:
          enabled: false
      prefill:
        create: false
      decode:
        create: true
        replicas: 1
        acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
              - NVIDIA-L40S  # L40S GPU
        parallelism:
          data: 1
          tensor: 1
        containers:
        - name: "vllm"
          env:
            - name: HF_HOME
              value: "/mnt/exp/.cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/mnt/exp/.cache/huggingface"
          mountModelVolume: true
          image: "vllm/vllm-openai:v0.15.1"
          modelCommand: vllmServe
          resources:
            limits:
              memory: 80Gi
              cpu: "16"
            requests:
              memory: 80Gi
              cpu: "16"
          extraConfig:
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 60
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            livenessProbe:
              tcpSocket:
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
          volumeMounts:
          - name: data
            mountPath: /mnt/exp

        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
