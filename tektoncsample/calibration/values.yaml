experiment:
  name: cal-h100

# Mixtral-8x22B EP calibration (TP2, DP4, EP=8)
# Previously completed: llama2-7b tp1, llama31-8b tp1/tp2, qwen3-14b tp1,
# codellama-34b tp2, mixtral-8x7b tp2/tp4, llama2-70b tp4, scout-17b tp2,
# mixtral-8x22b tp8, mixtral-8x22b tp4-ep (27.087 ms — unsafe).
configs:
  - label: mixtral-8x22b-h100-tp2-ep
    model_short: Mixtral-8x22B
    hf_id: "mistralai/Mixtral-8x22B-Instruct-v0.1"
    tp: 8  # 8 GPUs total: TP=2 × DP=4 with expert parallelism
    extra_overrides:
      # Override vLLM TP back to 2 (chart sets 8 for GPU alloc)
      - 'decode.containers[name="vllm"].args=--tensor-parallel-size=2'
      - 'decode.containers[name="vllm"].args=--data-parallel-size=4'
      - 'decode.containers[name="vllm"].args=--enable-expert-parallel'

# Model deployment config — same base as blis-inference-perf
stack:
  MAX_MODEL_LEN: 4096
  MAX_NUM_BATCHED_TOKENS: 2048
  MAX_NUM_SEQS: 128

  model:
    helmValues:
      fullnameOverride: FULLNAME
      serviceAccountOverride: default
      multinode: false
      modelArtifacts:
        uri: pvc://model-pvc/models/MODEL
        size: 300Gi
        authSecretName: "hf-secret"
        name: MODEL
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: FULLNAME
      routing:
        servicePort: 8000
        proxy:
          enabled: false
      prefill:
        create: false
      decode:
        create: true
        replicas: 1
        acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
              - NVIDIA-H100-80GB-HBM3
        parallelism:
          data: 1
          tensor: 1
        containers:
        - name: "vllm"
          env:
            - name: HF_HOME
              value: "/mnt/exp/.cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/mnt/exp/.cache/huggingface"
          mountModelVolume: true
          image: "vllm/vllm-openai:v0.15.1"
          modelCommand: vllmServe
          resources:
            limits:
              memory: 128Gi
              cpu: "32"
            requests:
              memory: 128Gi
              cpu: "32"
          extraConfig:
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 60
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            livenessProbe:
              tcpSocket:
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
          volumeMounts:
          - name: data
            mountPath: /mnt/exp

        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
