apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cal-h100
spec:
  description: 'Rate calibration: measure decode latency per token (1 configs in parallel)'
  workspaces:
  - name: model-cache
    description: Location where models are stored
  - name: hf-credentials
    description: Secret workspace containing a HuggingFace token
  - name: data
    description: Workspace for calibration results
  params:
  - name: namespace
    type: string
    description: Kubernetes namespace
  tasks:
  - name: download-model-mixtral-8x22b-h100-tp2-ep
    taskRef:
      name: download-model
    workspaces:
    - name: model-cache
    - name: hf-credentials
    params:
    - name: model
      value: mistralai/Mixtral-8x22B-Instruct-v0.1
  - name: deploy-model-mixtral-8x22b-h100-tp2-ep
    taskRef:
      name: deploy-model
    runAfter:
    - download-model-mixtral-8x22b-h100-tp2-ep
    workspaces:
    - name: model-cache
    params:
    - name: model
      value: mistralai/Mixtral-8x22B-Instruct-v0.1
    - name: modelLabel
      value: cal-mixtral-8x22b-h100-tp2-ep
    - name: namespace
      value: $(params.namespace)
    - name: config
      value:
        fullnameOverride: FULLNAME
        serviceAccountOverride: default
        multinode: false
        modelArtifacts:
          uri: pvc://model-pvc/models/MODEL
          size: 300Gi
          authSecretName: hf-secret
          name: MODEL
          labels:
            llm-d.ai/inferenceServing: 'true'
            llm-d.ai/model: FULLNAME
        routing:
          servicePort: 8000
          proxy:
            enabled: false
        prefill:
          create: false
        decode:
          create: true
          replicas: 1
          acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
            - NVIDIA-H100-80GB-HBM3
          parallelism:
            data: 1
            tensor: 1
          containers:
          - name: vllm
            env:
            - name: HF_HOME
              value: /mnt/exp/.cache/huggingface
            - name: TRANSFORMERS_CACHE
              value: /mnt/exp/.cache/huggingface
            mountModelVolume: true
            image: vllm/vllm-openai:v0.15.1
            modelCommand: vllmServe
            resources:
              limits:
                memory: 128Gi
                cpu: '32'
              requests:
                memory: 128Gi
                cpu: '32'
            extraConfig:
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                failureThreshold: 60
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 5
              livenessProbe:
                tcpSocket:
                  port: 8000
                failureThreshold: 3
                periodSeconds: 5
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
                failureThreshold: 3
                periodSeconds: 5
            volumeMounts:
            - name: data
              mountPath: /mnt/exp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data-pvc
    - name: overrides
      value:
      - decode.parallelism.tensor=8
      - decode.containers[name="vllm"].args=--max-model-len=4096
      - decode.containers[name="vllm"].args=--max-num-batched-tokens=2048
      - decode.containers[name="vllm"].args=--max-num-seqs=128
      - decode.containers[name="vllm"].args=--tensor-parallel-size=2
      - decode.containers[name="vllm"].args=--data-parallel-size=4
      - decode.containers[name="vllm"].args=--enable-expert-parallel
  - name: calibrate-mixtral-8x22b-h100-tp2-ep
    taskRef:
      name: calibrate-decode-latency
    runAfter:
    - deploy-model-mixtral-8x22b-h100-tp2-ep
    workspaces:
    - name: data
    params:
    - name: model
      value: mistralai/Mixtral-8x22B-Instruct-v0.1
    - name: modelLabel
      value: cal-mixtral-8x22b-h100-tp2-ep
    - name: results_dir
      value: calibration/mixtral-8x22b-h100-tp2-ep
  - name: delete-model-mixtral-8x22b-h100-tp2-ep
    runAfter:
    - calibrate-mixtral-8x22b-h100-tp2-ep
    taskRef:
      name: delete-model
    params:
    - name: namespace
      value: $(params.namespace)
    - name: modelLabel
      value: cal-mixtral-8x22b-h100-tp2-ep
  finally:
  - name: finally-delete-mixtral-8x22b-h100-tp2-ep
    taskRef:
      name: delete-model
    params:
    - name: namespace
      value: $(params.namespace)
    - name: modelLabel
      value: cal-mixtral-8x22b-h100-tp2-ep
