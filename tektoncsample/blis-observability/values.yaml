experiment:
  name: vllm-observability-demo
  description: Demonstration of vLLM observability features including journey tracing, step tracing, and KV cache events collection

stack:
  # Observability configuration
  tracing:
    # Journey tracing: per-request OTEL spans tracking full request lifecycle
    journey: true

    # Step tracing: scheduler step metrics exported as OTEL spans
    step:
      enabled: true
      sample_rate: 0.1              # 10% of batches sampled
      rich_subsample_rate: 0.1      # 10% of sampled batches get detailed metrics
      closure_interval: 10          # Close spans every 10 scheduler steps

    # KV cache events: block-level cache operations via ZMQ
    kv_events:
      enabled: true
      publisher: "zmq"
      offloading_size: 8.0          # CPU memory (GiB) for KV cache offloading

  # Workload configuration
  MAX_MODEL_LEN: 4096
  MAX_NUM_BATCHED_TOKENS: 2048
  MAX_NUM_SEQS: 256

  workload:
    app: chatsweep
    profile:
      rate_type: sweep
      max_requests: 50
      rate: 12
      random_seed: 42
      data:
        prefix_tokens: 284
        prompt_tokens: 70
        prompt_tokens_stdev: 35
        prompt_tokens_min: 2
        prompt_tokens_max: 200
        output_tokens: 215
        output_tokens_stdev: 80
        output_tokens_min: 1
        output_tokens_max: 512

  # workload:
  #   app: codesweep
  #   profile:
  #     rate_type: sweep
  #     max_requests: 50
  #     rate: 12
  #     random_seed: 42
  #     data:
  #       prompt_tokens: 2048
  #       prompt_tokens_stdev: 1974
  #       prompt_tokens_min: 2
  #       prompt_tokens_max: 3500
  #       output_tokens: 28
  #       output_tokens_stdev: 60
  #       output_tokens_min: 6
  #       output_tokens_max: 200

  model:
    helmValues:
      fullnameOverride: FULLNAME
      serviceAccountOverride: default
      multinode: false
      modelArtifacts:
        uri: pvc://model-pvc/models/MODEL
        size: 300Gi
        authSecretName: "hf-secret"
        name: MODEL
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: FULLNAME
      routing:
        servicePort: 8000
        proxy:
          enabled: false
      prefill:
        create: false
      decode:
        create: true
        replicas: 1
        acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
              - NVIDIA-H100-80GB-HBM3
        parallelism:
          data: 1
          tensor: 1
        initContainers:
        - name: install-otel-dependencies
          image: ghcr.io/inference-sim/vllm:0.6.8
          command: ["/bin/bash", "-c"]
          args:
          - |-
            set -e
            pip install --target=/deps \
              'opentelemetry-sdk>=1.26.0,<1.27.0' \
              'opentelemetry-api>=1.26.0,<1.27.0' \
              'opentelemetry-exporter-otlp>=1.26.0,<1.27.0' \
              'python-json-logger' \
              'opentelemetry-semantic-conventions-ai>=0.4.1,<0.5.0'
          volumeMounts:
            - name: deps
              mountPath: /deps
        containers:
        - name: "vllm"
          env:
            - name: PYTHONPATH
              value: /deps
            - name: OTEL_SERVICE_NAME
              value: "vllm-observability"
            - name: OTEL_TRACES_SAMPLER
              value: "traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-FULLNAME:4318"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://otel-FULLNAME:4318"
            - name: VLLM_CONFIGURE_LOGGING
              value: "1"
            - name: VLLM_LOGGING_CONFIG_PATH
              value: "/workspace/vllm_logging.json"
            # Fix cache permission issue
            - name: HF_HOME
              value: "/mnt/exp/.cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/mnt/exp/.cache/huggingface"
          mountModelVolume: true
          image: "ghcr.io/inference-sim/vllm:0.6.8"
          modelCommand: vllmServe
          resources:
            limits:
              memory: 128Gi
              cpu: "32"
            requests:
              memory: 128Gi
              cpu: "32"
          extraConfig:
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 60
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            livenessProbe:
              tcpSocket:
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
          volumeMounts:
          - name: data
            mountPath: /mnt/exp
          - name: deps
            mountPath: /deps

        # KV events subscriber sidecar
        - name: "kv-events-subscriber"
          image: "ghcr.io/inference-sim/vllm:0.6.8"
          modelCommand: custom
          command: ["python3"]
          args: ["examples/online_serving/kv_events_subscriber.py"]
          env:
          - name: VLLM_KV_EVENTS_SUB_ADDR
            value: "tcp://localhost:5557"
          - name: VLLM_KV_EVENTS_REPLAY_ADDR
            value: "tcp://localhost:5558"
          - name: VLLM_KV_EVENTS_OUTPUT_FILE
            value: "/mnt/exp/EXPERIMENTID/kv_events.jsonl"
          volumeMounts:
          - name: data
            mountPath: /mnt/exp

        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: deps
          emptyDir: {}

workload:
  harness: guidellm

upload_target:
  type: s3
  configuration:
    bucket: cloud-object-storage-cos-standard-ere
    endpoint: https://s3.us-east.cloud-object-storage.appdomain.cloud
