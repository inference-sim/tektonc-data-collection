apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: vllm-observability-run
spec:
  timeouts:
    pipeline: 3h        # Overall PipelineRun timeout
    tasks: 2h30m        # Per-task timeout
  taskRunTemplate:
    serviceAccountName: helm-installer
  workspaces:
    - name: model-cache
      persistentVolumeClaim:
        claimName: model-pvc
    - name: data
      persistentVolumeClaim:
        claimName: data-pvc
    - name: hf-credentials
      secret:
        secretName: hf-secret
        items:
          - key: HF_TOKEN
            path: HF_TOKEN
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    - name: target-credentials
      secret:
        secretName: s3-secret
        items:
          - key: AWS_ACCESS_KEY_ID
            path: AWS_ACCESS_KEY_ID
          - key: AWS_SECRET_ACCESS_KEY
            path: AWS_SECRET_ACCESS_KEY

  pipelineRef:
    name: vllm-observability-demo
  params:
    - { name: experimentId, value: "obs-exp-003" }
    - { name: model, value: "Qwen/Qwen2.5-1.5B-Instruct" }
    - { name: namespace, value: diya }
