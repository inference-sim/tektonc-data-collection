experiment:
  name: blis-orc
  description: BLIS with observe-replay-calibrate loop

stack:
  treatments:
    tensorParallelism:
      - 1
    dataLocalParallelism:
      - 1

  MAX_MODEL_LEN: 8192  # Default 8192; set to 0 in experiments.json to auto-detect from model config
  MAX_NUM_BATCHED_TOKENS: 2048
  MAX_NUM_SEQS: 128
  BLOCK_SIZE: 16
  extra_overrides: []

  model:
    helmValues:
      fullnameOverride: FULLNAME
      serviceAccountOverride: default
      multinode: false
      modelArtifacts:
        uri: pvc://model-pvc/models/MODEL
        size: 300Gi
        authSecretName: "hf-secret"
        name: MODEL
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: FULLNAME
      routing:
        servicePort: 8000
        proxy:
          enabled: false
      prefill:
        create: false
      decode:
        create: true
        replicas: 1
        acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
              - NVIDIA-H100-80GB-HBM3
        containers:
        - name: "vllm"
          env:
            - name: VLLM_CONFIGURE_LOGGING
              value: "1"
            - name: VLLM_LOGGING_CONFIG_PATH
              value: "/workspace/vllm_logging.json"
            # Fix cache permission issue
            - name: HF_HOME
              value: "/mnt/exp/.cache/huggingface"
            - name: TRANSFORMERS_CACHE
              value: "/mnt/exp/.cache/huggingface"
            # Deterministic prefix hashing across the KV-offload fs tier
            # (required when a filesystem secondary tier is configured;
            # harmless otherwise). See kv-offload multi-tier setup.
            - name: PYTHONHASHSEED
              value: "0"
          mountModelVolume: true
          image: "vllm/vllm-openai:v0.26.0"
          modelCommand: vllmServe
          resources:
            limits:
              memory: 128Gi
              cpu: "32"
            requests:
              memory: 128Gi
              cpu: "32"
          extraConfig:
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 60
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            livenessProbe:
              tcpSocket:
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
          volumeMounts:
          - name: data
            mountPath: /mnt/exp
          # KV-offload secondary (disk) tier root_dir — node-local scratch, so
          # the fs tier's block files don't hit the networked PVC. Only used when
          # an experiment configures a TieringOffloadingSpec fs secondary tier.
          - name: kv-cache
            mountPath: /mnt/kv_cache
          # Shared-memory region for the CPU offload primary tier.
          - name: shm
            mountPath: /dev/shm

        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: kv-cache
          emptyDir:
            sizeLimit: 50Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

orc:
  # Latency model for replay phase (trained-physics, linear, etc.)
  latency_model: trained-physics
  # GPU type for latency model selection (H100, A100, L40S)
  gpu_type: H100

workload:
  harness: orc

  # BLIS native workload specification (inference_perf format)
  # Note: model and endpoint are passed as CLI flags to blis observe
  orcSpec:
    inference_perf:
      stages:
        - rate: 8.0
          duration: 600
        - rate: 20.0
          duration: 600
      shared_prefix:
        num_unique_system_prompts: 9
        num_users_per_system_prompt: 5
        system_prompt_len: 100
        question_len: 447
        output_len: 248
        enable_multi_turn_chat: true

  # --- Corpus mode (weka-real) ------------------------------------------------
  # When `workload.corpus` is present (set by generate.py for a "weka-real"
  # experiment), the ORC template drives `blis observe` in CORPUS mode instead of
  # synthesizing from `orcSpec`: it replays a pre-staged TraceV2 corpus (produced
  # by `blis convert weka`) against the live server as a fixed pool of closed-loop
  # sessions. The corpus files are pre-downloaded onto the data PVC out of band;
  # corpus_header/corpus_data are absolute PVC paths the observe pod can read.
  # `orcSpec` is ignored when this block is present. Example:
  #
  # corpus:
  #   corpus_header: /mnt/data/weka-real/weka.yaml
  #   corpus_data:   /mnt/data/weka-real/weka.csv
  #   concurrent_sessions: 32   # blis observe --concurrent-sessions
  #   total_sessions: 0         # --total-sessions (0 = each corpus session once)
  #   shuffle_corpus: false     # --shuffle-corpus (match replay for parity)

upload_target:
  type: s3
  configuration:
    bucket: cloud-object-storage-cos-standard-ere
    endpoint: https://s3.us-east.cloud-object-storage.appdomain.cloud
