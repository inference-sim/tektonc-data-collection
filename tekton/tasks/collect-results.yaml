# tektonc-data-collection/tekton/tasks/collect-results.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-results
spec:
  description: >-
    Synchronization barrier, vLLM log collector, and resource manifest
    snapshot. Runs after all run-workload-blis-observe tasks. Collects
    vLLM decode + prefill pod logs and deployed resource manifests into
    the workload results directory on data-pvc, then writes the
    epp_stream_done, gpu_stream_done, and metrics_stream_done sentinels
    that signal the parallel streamers (stream-epp-logs,
    stream-gpu-stats, stream-metrics) to stop, before the finally block
    tears down deployments.


    ASSUMPTIONS:

    1. One model stack per namespace — pod discovery uses type-based
       selectors (not model-specific labels), so all pods of a given
       type in the namespace are collected. This invariant is enforced
       by deploy.py slot allocation in the sim2real pipeline.

    2. Stack deployed via llmdbenchmark standup — which installs the
       llm-d-modelservice Helm chart (applies llm-d.ai/role=decode and
       llm-d.ai/role=prefill).
       Alternative deployment methods may not apply these labels.

    3. EPP logs are captured by the parallel stream-epp-logs task; this
       task no longer reads EPP container logs directly.

  workspaces:
    - name: data
      description: "Shared PVC (data-pvc)"

  params:
    - { name: namespace,       type: string }
    - { name: resultsDir,      type: string }
    - { name: containerName,   type: string, default: "epp" }
    - name: resourceKinds
      type: string
      default: "pod,deployment,service,inferencepool,inferencemodel,gateway,httproute"
      description: >-
        Comma-separated list of Kubernetes resource kinds to collect
        manifests for. Kinds not registered on the cluster or with zero
        instances in the namespace are silently skipped.

  steps:
    - name: barrier
      image: alpine:3.19
      script: |
        #!/bin/sh
        echo "All workload tasks complete."
        echo "Results available on data-pvc."

    - name: collect-logs
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set +e

        NAMESPACE="$(params.namespace)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        SERVER_LOG_DIR="${RESULTS_DIR}/server_logs"

        # RESULTS_DIR is created by an upstream pipeline step; do not wipe
        # it here. This task only owns server_logs/ within it.
        rm -f "${RESULTS_DIR}/epp_stream_done"
        rm -f "${RESULTS_DIR}/gpu_stream_done"
        rm -f "${RESULTS_DIR}/metrics_stream_done"
        rm -rf "${SERVER_LOG_DIR}"
        mkdir -p "${SERVER_LOG_DIR}"

        # --- vLLM decode pod logs (llm-d-modelservice chart label) ---
        DECODE_PODS=$(kubectl get pods -n "${NAMESPACE}" \
          -l "llm-d.ai/role=decode" \
          --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)

        if [ -z "${DECODE_PODS}" ]; then
          echo "WARNING: No vLLM decode pods found (llm-d.ai/role=decode), skipping."
        else
          for pod in ${DECODE_PODS}; do
            echo "Collecting vLLM decode logs: ${pod}"
            kubectl logs "${pod}" -n "${NAMESPACE}" -c vllm \
              > "${SERVER_LOG_DIR}/${pod}_vllm.log" 2>&1
          done
        fi

        # --- vLLM prefill pod logs (llm-d-modelservice chart label) ---
        PREFILL_PODS=$(kubectl get pods -n "${NAMESPACE}" \
          -l "llm-d.ai/role=prefill" \
          --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)

        if [ -z "${PREFILL_PODS}" ]; then
          echo "No vLLM prefill pods found (llm-d.ai/role=prefill), skipping."
        else
          for pod in ${PREFILL_PODS}; do
            echo "Collecting vLLM prefill logs: ${pod}"
            kubectl logs "${pod}" -n "${NAMESPACE}" -c vllm \
              > "${SERVER_LOG_DIR}/${pod}_vllm.log" 2>&1
          done
        fi

        # Signal sibling streamers that this workload is done so they can stop.
        # One sentinel per streamer keeps them independent; a pipeline
        # running only a subset of streamers is unaffected by the others.
        touch "${RESULTS_DIR}/epp_stream_done"
        touch "${RESULTS_DIR}/gpu_stream_done"
        touch "${RESULTS_DIR}/metrics_stream_done"

        echo "Server log collection complete for $(params.resultsDir)."

    - name: collect-resources
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set +e

        NAMESPACE="$(params.namespace)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        RES_DIR="${RESULTS_DIR}/resources"

        rm -rf "${RES_DIR}"
        mkdir -p "${RES_DIR}"

        KINDS="$(params.resourceKinds)"

        for kind in $(echo "${KINDS}" | tr ',' ' '); do
          ITEMS=$(kubectl get "${kind}" -n "${NAMESPACE}" \
            --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)

          if [ -z "${ITEMS}" ]; then
            echo "No ${kind} resources found, skipping."
            continue
          fi

          for name in ${ITEMS}; do
            echo "Collecting ${kind}: ${name}"
            kubectl get "${kind}" "${name}" -n "${NAMESPACE}" -o yaml \
              > "${RES_DIR}/${kind}-${name}.yaml" 2>/dev/null
            if [ $? -ne 0 ]; then
              echo "WARNING: failed to get ${kind}/${name}, removing partial file"
              rm -f "${RES_DIR}/${kind}-${name}.yaml"
            fi
          done
        done

        echo "Resource collection complete for $(params.resultsDir)"
