# tektonc-data-collection/tekton/tasks/collect-results.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-results
spec:
  description: >-
    Synchronization barrier. Runs after all run-workload-blis-observe tasks.
    Also collects EPP and vLLM decode pod logs into the workload results directory
    on data-pvc before the finally block deletes those deployments.

  workspaces:
    - name: data
      description: "Shared PVC (data-pvc)"

  params:
    - { name: namespace,   type: string }
    - { name: modelLabel,  type: string }
    - { name: resultsDir,  type: string }
    - { name: containerName,   type: string, default: "epp" }
    - { name: windowMinutes,   type: string, default: "2" }

  steps:
    - name: barrier
      image: alpine:3.19
      script: |
        #!/bin/sh
        echo "All workload tasks complete."
        echo "Results available on data-pvc."

    - name: collect-logs
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        # Non-fatal: failures here must not fail the pipeline.
        set +e

        NAMESPACE="$(params.namespace)"
        MODEL_LABEL="$(params.modelLabel)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"

        mkdir -p "${RESULTS_DIR}"

        # --- vLLM decode pod logs ---
        SERVER_LOG_DIR="${RESULTS_DIR}/server_logs"
        rm -rf "${SERVER_LOG_DIR}"
        mkdir -p "${SERVER_LOG_DIR}"

        DECODE_PODS=$(kubectl get pods -n "${NAMESPACE}" \
          -l "llm-d.ai/model=${MODEL_LABEL}" \
          --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)

        if [ -z "${DECODE_PODS}" ]; then
          echo "No vLLM decode pods found for llm-d.ai/model=${MODEL_LABEL}, skipping."
        else
          for pod in ${DECODE_PODS}; do
            echo "Collecting vLLM logs: ${pod}"
            kubectl logs "${pod}" -n "${NAMESPACE}" -c vllm \
              > "${SERVER_LOG_DIR}/${pod}_vllm.log" 2>&1
          done
        fi

        echo "Log collection complete for $(params.resultsDir)."

    - name: collect-epp-logs
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set +e

        NAMESPACE="$(params.namespace)"
        MODEL_LABEL="$(params.modelLabel)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        LOG_DIR="${RESULTS_DIR}/epp_logs"
        WINDOW="$(params.windowMinutes)"
        SINCE_FILE="${RESULTS_DIR}/epp_log_since"

        rm -rf "${LOG_DIR}"
        mkdir -p "${LOG_DIR}"

        # Determine collection window from the marker written by run-workload-blis-observe.
        # Falls back to --since=30m if marker is missing (e.g. old pipeline run).
        if [ -f "${SINCE_FILE}" ]; then
          SINCE_TIME=$(cat "${SINCE_FILE}")
          SINCE_ARG="--since-time=${SINCE_TIME}"
          echo "Collecting EPP logs since ${SINCE_TIME}"
        else
          echo "WARNING: epp_log_since marker not found, falling back to --since=30m"
          SINCE_ARG="--since=30m"
        fi

        # Pod discovery — same truncation logic as deploy-gaie and stream-epp-logs.
        RELEASE="${MODEL_LABEL}-gaie"
        EPP_DEPLOY="$(echo -n "${RELEASE}" | cut -c1-40)-epp"

        EPP_PODS=$(kubectl get pods -n "${NAMESPACE}" --no-headers 2>/dev/null \
          | grep "^${EPP_DEPLOY}" | awk '$3 == "Running" {print $1}' || true)

        if [ -z "${EPP_PODS}" ]; then
          echo "WARNING: No running EPP pods found with prefix ${EPP_DEPLOY}, skipping."
          exit 0
        fi

        for pod in ${EPP_PODS}; do
          echo "Collecting EPP logs: ${pod} → ${LOG_DIR}/"
          kubectl logs ${SINCE_ARG} --timestamps=true "${pod}" \
            -n "${NAMESPACE}" -c "$(params.containerName)" \
            | awk -v outdir="${LOG_DIR}" -v pod="${pod}" -v win="${WINDOW}" '
              {
                split($1, dt, "T")
                split(dt[2], tm, ":")
                hour = tm[1]
                min  = int(tm[2])
                bucket = int(min / win) * win
                fname = sprintf("%s/%s_%s%02d.log", outdir, pod, hour, bucket)
                if (fname != _prev) {
                  system("mkdir -p " outdir)
                  _prev = fname
                }
                out = ""
                for (i = 2; i <= NF; i++) out = out (i > 2 ? " " : "") $i
                print out >> fname
                fflush(fname)
              }
            '
        done

        echo "EPP log collection complete for $(params.resultsDir)"
