# tektonc-data-collection/tekton/tasks/collect-results.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-results
spec:
  description: >-
    Synchronization barrier and log collector. Runs after all
    run-workload-blis-observe tasks. Collects vLLM (decode + prefill)
    and EPP pod logs into the workload results directory on data-pvc
    before the finally block tears down deployments.

  workspaces:
    - name: data
      description: "Shared PVC (data-pvc)"

  params:
    - { name: namespace,       type: string }
    - { name: resultsDir,      type: string }
    - { name: containerName,   type: string, default: "epp" }
    - { name: windowMinutes,   type: string, default: "2" }

  steps:
    - name: barrier
      image: alpine:3.19
      script: |
        #!/bin/sh
        echo "All workload tasks complete."
        echo "Results available on data-pvc."

    - name: collect-logs
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set +e

        NAMESPACE="$(params.namespace)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        SERVER_LOG_DIR="${RESULTS_DIR}/server_logs"

        mkdir -p "${RESULTS_DIR}"
        rm -rf "${SERVER_LOG_DIR}"
        mkdir -p "${SERVER_LOG_DIR}"

        # --- vLLM decode pod logs (llm-d-modelservice chart label) ---
        DECODE_PODS=$(kubectl get pods -n "${NAMESPACE}" \
          -l "llm-d.ai/role=decode" \
          --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)

        if [ -z "${DECODE_PODS}" ]; then
          echo "WARNING: No vLLM decode pods found (llm-d.ai/role=decode), skipping."
        else
          for pod in ${DECODE_PODS}; do
            echo "Collecting vLLM decode logs: ${pod}"
            kubectl logs "${pod}" -n "${NAMESPACE}" -c vllm \
              > "${SERVER_LOG_DIR}/${pod}_vllm.log" 2>&1
          done
        fi

        # --- vLLM prefill pod logs (llm-d-modelservice chart label) ---
        PREFILL_PODS=$(kubectl get pods -n "${NAMESPACE}" \
          -l "llm-d.ai/role=prefill" \
          --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)

        if [ -z "${PREFILL_PODS}" ]; then
          echo "No vLLM prefill pods found (llm-d.ai/role=prefill), skipping."
        else
          for pod in ${PREFILL_PODS}; do
            echo "Collecting vLLM prefill logs: ${pod}"
            kubectl logs "${pod}" -n "${NAMESPACE}" -c vllm \
              > "${SERVER_LOG_DIR}/${pod}_vllm.log" 2>&1
          done
        fi

        echo "Server log collection complete for $(params.resultsDir)."

    - name: collect-epp-logs
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set +e

        NAMESPACE="$(params.namespace)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        LOG_DIR="${RESULTS_DIR}/epp_logs"
        WINDOW="$(params.windowMinutes)"
        SINCE_FILE="${RESULTS_DIR}/epp_log_since"

        rm -rf "${LOG_DIR}"
        mkdir -p "${LOG_DIR}"

        # Determine collection window from marker written by run-workload-blis-observe.
        if [ -f "${SINCE_FILE}" ]; then
          SINCE_TIME=$(cat "${SINCE_FILE}")
          SINCE_ARG="--since-time=${SINCE_TIME}"
          echo "Collecting EPP logs since ${SINCE_TIME}"
        else
          echo "WARNING: epp_log_since marker not found, falling back to --since=30m"
          SINCE_ARG="--since=30m"
        fi

        # --- EPP pod discovery (inferencepool chart label) ---
        EPP_PODS=$(kubectl get pods -n "${NAMESPACE}" \
          -l "app.kubernetes.io/managed-by=inferencepool" \
          --field-selector=status.phase=Running \
          --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)

        if [ -z "${EPP_PODS}" ]; then
          echo "WARNING: No running EPP pods found (app.kubernetes.io/managed-by=inferencepool), skipping."
          exit 0
        fi

        for pod in ${EPP_PODS}; do
          echo "Collecting EPP logs: ${pod} -> ${LOG_DIR}/"
          kubectl logs ${SINCE_ARG} --timestamps=true "${pod}" \
            -n "${NAMESPACE}" -c "$(params.containerName)" \
            | awk -v outdir="${LOG_DIR}" -v pod="${pod}" -v win="${WINDOW}" '
              {
                split($1, dt, "T")
                split(dt[2], tm, ":")
                hour = tm[1]
                min  = int(tm[2])
                bucket = int(min / win) * win
                fname = sprintf("%s/%s_%s%02d.log", outdir, pod, hour, bucket)
                if (fname != _prev) {
                  system("mkdir -p " outdir)
                  _prev = fname
                }
                out = ""
                for (i = 2; i <= NF; i++) out = out (i > 2 ? " " : "") $i
                print out >> fname
                fflush(fname)
              }
            '
        done

        echo "EPP log collection complete for $(params.resultsDir)"
