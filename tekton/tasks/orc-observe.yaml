apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: orc-observe
spec:
  description: |
    Run BLIS observe phase against deployed vLLM model.
    Outputs TraceV2 format (header.yaml + data.csv) for replay phase.

  workspaces:
    - name: data
      description: Shared workspace containing blis binary and output directory
    - name: hf-credentials
      description: HuggingFace credentials for model access

  params:
    - name: model
      type: string
      description: Model name for substitution in workload spec
    - name: modelLabel
      type: string
      description: Label to find model pod (llm-d.ai/model=<label>)
    - name: results_dir
      type: string
      description: Results directory path (observe outputs go to <results_dir>/observe/)
    - name: workloadSpec
      type: string
      description: BLIS native workload spec YAML (WorkloadSpec format). Empty in corpus-mode (weka-real), where the corpus replaces the synthesized spec.
      default: ""
    - name: horizon
      type: string
      description: Time horizon in seconds (bounds workload generation)
      default: ""
    - name: saturationDetectors
      type: string
      description: 'Saturation detector(s) for --detectors: composite|threshold|backlog-drift, a comma-list of those, or "all". Empty = detection off.'
      default: ""
    - name: scrapeKvMetrics
      type: string
      description: '"true" to pass --scrape-kv-metrics (record vLLM KV-cache hit-rate / kv_offload_tiering_* counters in the trace header). Off by default; only useful for KV-offload experiments.'
      default: "false"

    # --- Corpus-mode (weka-real) inputs ---------------------------------------
    # When concurrentSessions != "0", observe runs in CORPUS mode: it replays a
    # pre-staged TraceV2 corpus (corpusHeader + corpusData, produced by
    # `blis convert weka`) against the server via a fixed pool of closed-loop
    # sessions, instead of synthesizing from workloadSpec. The corpus files are
    # pre-downloaded onto the data PVC out of band. These params are paths
    # RELATIVE to the data workspace (the data-pvc root, same volume the busybox
    # helper mounts at /data); the task prepends $(workspaces.data.path). In
    # corpus mode workloadSpec is ignored.
    - name: corpusHeader
      type: string
      description: 'Corpus-mode: data-workspace-relative path to the input TraceV2 header YAML (e.g. weka-real/full/weka.yaml). Empty = spec-mode.'
      default: ""
    - name: corpusData
      type: string
      description: 'Corpus-mode: data-workspace-relative path to the input TraceV2 data CSV (e.g. weka-real/full/weka.csv). Empty = spec-mode.'
      default: ""
    - name: concurrentSessions
      type: string
      description: 'Corpus-mode: number of concurrent closed-loop sessions to replay (blis observe --concurrent-sessions). "0" = spec-mode (use workloadSpec).'
      default: "0"
    - name: totalSessions
      type: string
      description: 'Corpus-mode: total sessions to replay (blis observe --total-sessions). "0" = replay each corpus session once.'
      default: "0"
    - name: shuffleCorpus
      type: string
      description: 'Corpus-mode: "true" to pass --shuffle-corpus (seeded reorder; must match replay for calibration parity).'
      default: "false"

  steps:
    - name: discover-endpoint
      env:
        - name: MODEL_LABEL
          value: "$(params.modelLabel)"
      image: alpine/kubectl:1.34.1
      script: |
        #!/bin/sh
        set -eu

        echo "🔍 Discovering model pod endpoint..."

        # Get model pod IP (same approach as inference-perf)
        podIP=$(kubectl get po -l llm-d.ai/model=${MODEL_LABEL},llm-d.ai/role=decode -o jsonpath='{.items[0].status.podIP}')

        if [ -z "$podIP" ]; then
          echo "❌ Failed to find model pod with label llm-d.ai/model=${MODEL_LABEL}"
          exit 1
        fi

        targetUrl="http://${podIP}:8000"
        echo "✅ Model endpoint: ${targetUrl}"

        # Store endpoint for next step
        echo -n "${targetUrl}" > /tekton/home/endpoint.txt

    - name: create-workload-spec
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu

        OBSERVE_DIR="$(workspaces.data.path)/$(params.results_dir)/observe"
        WORKLOAD_SPEC="${OBSERVE_DIR}/workload.yaml"

        mkdir -p "${OBSERVE_DIR}"

        # Corpus mode (weka-real): observe replays a pre-staged TraceV2 corpus,
        # so there is NO workload spec to materialize. Skip spec creation; only
        # persist the endpoint for run-observe.
        if [ -n "$(params.corpusHeader)" ]; then
          echo "🗂  Corpus mode: skipping workload-spec creation (corpus: $(params.corpusHeader))"
        else
          echo "📝 Creating BLIS workload spec..."

          # Install Python and PyYAML for JSON to YAML conversion
          apk add --no-cache python3 py3-pip
          pip3 install --break-system-packages pyyaml

          # Convert JSON workload spec to proper YAML
          # (Tekton passes it as JSON, but BLIS expects YAML)
          echo '$(params.workloadSpec)' > /tmp/workload.json
          python3 -c "import json, yaml; print(yaml.dump(json.load(open('/tmp/workload.json')), default_flow_style=False))" > "${WORKLOAD_SPEC}"

          echo ">>> Created workload spec:"
          cat "${WORKLOAD_SPEC}"
        fi

        # Store endpoint for next step (both modes)
        ENDPOINT=$(cat /tekton/home/endpoint.txt)
        echo -n "${ENDPOINT}" > "${OBSERVE_DIR}/endpoint.txt"

    - name: run-observe
      image: python:3.12.9-slim-bookworm
      computeResources:
        requests:
          memory: "16Gi"
          cpu: "8"
        limits:
          memory: "16Gi"
          cpu: "8"
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
      script: |
        #!/bin/bash
        set -eu

        OBSERVE_DIR="$(workspaces.data.path)/$(params.results_dir)/observe"
        WORKLOAD_SPEC="${OBSERVE_DIR}/workload.yaml"
        BLIS_BINARY="$(workspaces.data.path)/blis"
        ENDPOINT=$(cat "${OBSERVE_DIR}/endpoint.txt")
        MODEL="$(params.model)"

        echo "🚀 Running BLIS observe phase..."
        echo "OBSERVE_DIR=${OBSERVE_DIR}"
        echo "WORKLOAD_SPEC=${WORKLOAD_SPEC}"
        echo "BLIS_BINARY=${BLIS_BINARY}"
        echo "ENDPOINT=${ENDPOINT}"
        echo "MODEL=${MODEL}"

        # Verify blis binary exists
        if [ ! -x "${BLIS_BINARY}" ]; then
          echo "❌ BLIS binary not found at ${BLIS_BINARY}"
          echo "Make sure install-blis task ran successfully"
          exit 1
        fi

        # Install required Python dependencies for BLIS
        echo "📦 Installing Python dependencies..."
        pip install -q tokenizers transformers

        # Run blis observe with CLI flags for model and endpoint
        # Output: header.yaml and data.csv (TraceV2 format)
        cd "${OBSERVE_DIR}"

        # Build horizon flag if provided
        # BLIS observe expects horizon in microseconds, but pipeline param is in seconds
        HORIZON_FLAG=""
        if [ -n "$(params.horizon)" ] && [ "$(params.horizon)" != "0" ]; then
          HORIZON_SECONDS=$(params.horizon)
          HORIZON_MICROSECONDS=$((HORIZON_SECONDS * 1000000))
          HORIZON_FLAG="--horizon ${HORIZON_MICROSECONDS}"
        fi

        # Build saturation detection flags if a detector is selected.
        # Non-empty saturationDetectors enables detection (matches BLIS: empty --detectors = off).
        # Value is composite|threshold|backlog-drift, a comma-list, or "all".
        SATURATION_FLAGS=""
        if [ -n "$(params.saturationDetectors)" ]; then
          SATURATION_FLAGS="--detectors $(params.saturationDetectors) --saturation-report saturation_analysis.json"
        fi

        # KV-metrics scraping (opt-in per experiment). Records vLLM's KV-cache
        # hit-rate / kv_offload_tiering_* counters in the trace header. Off unless
        # the experiment sets scrape_kv_metrics=true (KV-offload experiments).
        SCRAPE_KV_FLAG=""
        if [ "$(params.scrapeKvMetrics)" = "true" ]; then
          SCRAPE_KV_FLAG="--scrape-kv-metrics"
        fi

        # Build the workload-input flags. Two modes:
        #  - CORPUS mode (weka-real): concurrentSessions != "0" -> replay a
        #    pre-staged TraceV2 corpus against the server. Uses --corpus-header/
        #    --corpus-data --concurrent-sessions [--total-sessions] [--shuffle-corpus].
        #    The corpus IS the workload, so --workload-spec / --horizon /
        #    --num-requests / --warmup-requests are rejected by blis observe (they
        #    are spec-mode knobs); we omit them. Warmup is dropped so the recorded
        #    request set matches `blis replay` of the same corpus request-for-request
        #    (the request_id join blis calibrate needs).
        #  - SPEC mode (default): synthesize from workload.yaml as before.
        WARMUP_FLAG="--warmup-requests 50"
        if [ "$(params.concurrentSessions)" != "0" ]; then
          MODE="corpus"
          # corpusHeader/corpusData are RELATIVE to the data workspace (the
          # data-pvc root). Resolve against $(workspaces.data.path) so they point
          # at the pre-staged corpus regardless of the pod's mount path.
          CORPUS_HEADER="$(workspaces.data.path)/$(params.corpusHeader)"
          CORPUS_DATA="$(workspaces.data.path)/$(params.corpusData)"
          if [ ! -f "${CORPUS_HEADER}" ] || [ ! -f "${CORPUS_DATA}" ]; then
            echo "❌ Corpus mode: corpus files not found on PVC."
            echo "   --corpus-header ${CORPUS_HEADER}"
            echo "   --corpus-data   ${CORPUS_DATA}"
            echo "   Pre-stage the TraceV2 pair (from 'blis convert weka') onto the data PVC before running."
            exit 1
          fi
          TOTAL_SESSIONS_FLAG=""
          if [ "$(params.totalSessions)" != "0" ]; then
            TOTAL_SESSIONS_FLAG="--total-sessions $(params.totalSessions)"
          fi
          SHUFFLE_FLAG=""
          if [ "$(params.shuffleCorpus)" = "true" ]; then
            SHUFFLE_FLAG="--shuffle-corpus"
          fi
          WORKLOAD_FLAGS="--corpus-header ${CORPUS_HEADER} --corpus-data ${CORPUS_DATA} --concurrent-sessions $(params.concurrentSessions) ${TOTAL_SESSIONS_FLAG} ${SHUFFLE_FLAG}"
          HORIZON_FLAG=""   # corpus-mode rejects --horizon (self-drains on sessions)
          WARMUP_FLAG=""    # keep every recorded request for the replay join
        else
          MODE="spec"
          WORKLOAD_FLAGS="--workload-spec ${WORKLOAD_SPEC}"
        fi

        echo "🔍 BLIS observe command (mode=${MODE}):"
        echo "${BLIS_BINARY} observe --server-url \"${ENDPOINT}\" --model \"${MODEL}\" ${WORKLOAD_FLAGS} --trace-header header.yaml --trace-data data.csv ${WARMUP_FLAG} --record-itl --itl-output itl.csv --timeout 660 ${SCRAPE_KV_FLAG} ${HORIZON_FLAG} ${SATURATION_FLAGS}"
        echo ""
        if [ "${MODE}" = "corpus" ]; then
          echo "🗂  Corpus mode: pool=$(params.concurrentSessions) total=$(params.totalSessions) shuffle=$(params.shuffleCorpus)"
          echo "   corpus-header=$(params.corpusHeader)"
          echo "   corpus-data=$(params.corpusData)"
        else
          echo "🔥 Using warmup-requests=50 (first 50 requests excluded from trace)"
        fi
        echo "⏱️  Using timeout=660 seconds (11 minutes per request)"
        echo "⏰ No overall observe timeout — runs until the corpus drains (bounded only by the Tekton task timeout)"
        if [ -n "${HORIZON_FLAG}" ]; then
          echo "🕐 Using horizon=$(params.horizon) seconds to bound observation duration"
        fi
        if [ -n "$(params.saturationDetectors)" ]; then
          echo "🎯 Saturation detection ENABLED (detectors: $(params.saturationDetectors)) - will output saturation_analysis.json"
        fi
        echo ""

        # Run BLIS observe with NO overall wall-clock cap — it runs until the
        # workload finishes (corpus drains / horizon reached). The only outer bound
        # is the Tekton task-level timeout (see data_pipeline.yaml.j2). This lets a
        # full corpus replay run to completion (weka corpora can take hours).
        #
        # NOTE: We ignore the exit code and check if data was exported successfully.
        # BLIS may exit non-zero on its internal horizon limit, but it still exports
        # all collected data before exiting. That is a success, not a failure.
        #
        # CRITICAL: Disable 'set -e' around BLIS execution so we can capture its exit
        # code without the script terminating immediately. The 'set -eu' at the top
        # would otherwise kill the script before we can check if data was exported.
        set +e  # Disable exit-on-error
        set -o pipefail  # Ensure we capture blis's exit code, not tee's
        ${BLIS_BINARY} observe \
          --server-url "${ENDPOINT}" \
          --model "${MODEL}" \
          ${WORKLOAD_FLAGS} \
          --trace-header "header.yaml" \
          --trace-data "data.csv" \
          ${WARMUP_FLAG} \
          --record-itl \
          --itl-output "itl.csv" \
          --timeout 660 \
          ${SCRAPE_KV_FLAG} \
          ${HORIZON_FLAG} \
          ${SATURATION_FLAGS} \
          2>&1 | tee observe.log

        RC=${PIPESTATUS[0]}  # Get blis's exit code, not tee's
        set -e  # Re-enable exit-on-error

        echo "BLIS observe exited with code: $RC"

        # Check if data was successfully exported (the real success criterion)
        if [ -f "data.csv" ] && [ -f "header.yaml" ]; then
          REQUEST_COUNT=$(tail -n +2 data.csv | wc -l)
          echo "✅ BLIS observe completed - data exported successfully"
          echo "📊 Collected ${REQUEST_COUNT} requests"

          if [ $RC -eq 124 ]; then
            echo "ℹ️  BLIS exited with code 124 (horizon limit reached)"
            echo "   This is expected when observation reaches its time limit"
          fi

          echo "📊 Trace files:"
          ls -lh header.yaml data.csv itl.csv 2>/dev/null

          # Check for saturation analysis output if a detector was selected
          if [ -n "$(params.saturationDetectors)" ]; then
            if [ -f "saturation_analysis.json" ]; then
              echo "🎯 Saturation analysis:"
              cat saturation_analysis.json
            else
              echo "⚠️  Warning: Saturation detection was enabled but saturation_analysis.json was not created"
            fi
          fi

          exit 0  # Success - data exported
        else
          # Data files missing - this is a real failure
          echo "❌ BLIS observe failed - no data exported"
          echo "Exit code was: $RC"
          echo "Current directory contents:"
          ls -la
          exit 1  # Failure - retry
        fi
