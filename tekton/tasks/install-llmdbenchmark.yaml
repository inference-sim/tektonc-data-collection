apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: install-llmdbenchmark
spec:
  description: |
    Prepare everything standup/teardown need: clone llm-d-benchmark, install
    its Python venv, install CLI tools (helm/kubectl/helmfile/etc), install
    the helm-diff plugin, and persist tools to the shared source workspace.

    Uses a sentinel file to skip the whole task when the same git commit is
    already installed and the workspace tool/plugin caches are intact.

    Tools are persisted to ${TOOL_BIN} on the workspace; the helm-diff plugin
    is installed under ${HELM_DATA_HOME} on the workspace so subsequent tasks
    (standup, teardown) running in fresh pods find both via PATH/env.

  params:
    - name: git_commit
      type: string
      description: Git commit SHA to install; written to sentinel file after install
    - name: git_repo_url
      type: string
      default: "https://github.com/llm-d/llm-d-benchmark.git"
      description: Git repository URL for llm-d-benchmark

  workspaces:
    - name: source

  steps:
    - name: install-packages
      image: python:3.12-slim
      securityContext:
        runAsUser: 0
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
      script: |
        #!/bin/bash
        set -eux

        export GITHUB_TOKEN="${GITHUB_TOKEN}"

        REPO_DIR="$(workspaces.source.path)/llm-d-benchmark"
        VENV_PATH="${REPO_DIR}/.venv"
        TOOL_BIN="${REPO_DIR}/.tools/bin"
        export HELM_DATA_HOME="${REPO_DIR}/.helm-data"
        SENTINEL=${VENV_PATH}/installed-commit
        GIT_COMMIT="$(params.git_commit)"
        REPO_URL="$(params.git_repo_url)"
        SENTINEL_KEY="${REPO_URL}@${GIT_COMMIT}"

        # Fast path: same commit, tools+plugin caches intact → skip everything
        if [ -f "${SENTINEL}" ] && [ "$(cat ${SENTINEL})" = "${SENTINEL_KEY}" ] \
           && [ -x "${TOOL_BIN}/kubectl" ] && [ -x "${TOOL_BIN}/helmfile" ] \
           && [ -x "${TOOL_BIN}/helm" ] && [ -d "${HELM_DATA_HOME}/plugins/helm-diff" ]; then
          echo "✔ llm-d-benchmark already prepared (${SENTINEL_KEY}), skipping"
          exit 0
        fi

        echo "🔄 Installing apt packages"
        apt-get update -y
        apt-get install -y git sudo
        rm -rf /var/lib/apt/lists/*

        CURRENT_REMOTE=$(git -C "${REPO_DIR}" remote get-url origin 2>/dev/null || true)
        if [ ! -d "${REPO_DIR}/.git" ]; then
          echo "📥 Cloning llm-d-benchmark@${GIT_COMMIT} from ${REPO_URL}"
          rm -rf "${REPO_DIR}"
          git clone "${REPO_URL}" "${REPO_DIR}"
        elif [ "${CURRENT_REMOTE}" != "${REPO_URL}" ]; then
          # Update remote in-place rather than rm + re-clone. RWX PVCs (NFS/GPFS)
          # often have stale file handles from prior pods, causing rm -rf to fail
          # with "Stale file handle" on cached .pyc files in the venv.
          echo "🔄 Updating remote: ${CURRENT_REMOTE} → ${REPO_URL}"
          git -C "${REPO_DIR}" remote set-url origin "${REPO_URL}"
        fi
        git -C "${REPO_DIR}" fetch origin
        git -C "${REPO_DIR}" checkout "${GIT_COMMIT}"

        if [ ! -d "${VENV_PATH}" ]; then
          python -m venv "${VENV_PATH}"
        fi
        source "${VENV_PATH}/bin/activate"

        echo "📦 Installing llm-d-benchmark"
        pip install -e "${REPO_DIR}/"
        echo "✔ Done installing llm-d-benchmark"

        echo "📦 Installing planner (llm-d-planner)"
        PLANNER_GIT=$(grep 'PLANNER_GIT=' "${REPO_DIR}/install.sh" | head -1 | sed 's/.*="\(.*\)"/\1/')
        if [ -z "${PLANNER_GIT}" ]; then
          echo "❌ Could not extract PLANNER_GIT from install.sh — check grep pattern matches file format"
          exit 1
        fi
        pip install "${PLANNER_GIT}"
        echo "✔ Done installing planner"
        pip list

        echo "🔍 Verifying llmdbenchmark installation"
        llmdbenchmark --version

        # CLI tools (helm, kubectl, helmfile, kustomize, yq, jq, crane, skopeo)
        # plus the helm-diff plugin required by `helmfile apply`. install.sh has
        # per-tool already-installed checks, so re-running is a fast no-op.
        # HELM_DATA_HOME is on the PVC so the helm-diff plugin survives across
        # pods/containers (standup and teardown run in fresh pods and rely on
        # the cached plugin to drive `helmfile apply`/`destroy`).
        mkdir -p "${HELM_DATA_HOME}"
        echo "🔧 Installing CLI tools and helm-diff plugin via install.sh"
        (cd "${REPO_DIR}" && bash install.sh --no-uv)

        # Persist binaries to the workspace so standup/teardown find them on PATH.
        echo "🔧 Persisting CLI tools to ${TOOL_BIN}"
        mkdir -p "${TOOL_BIN}"
        for tool in kubectl helmfile helm kustomize yq jq crane skopeo; do
          if [ -f "/usr/local/bin/${tool}" ]; then
            cp -f "/usr/local/bin/${tool}" "${TOOL_BIN}/"
          fi
        done

        # Sentinel written last so an interrupted run leaves it unset and the
        # next attempt redoes everything end-to-end.
        echo "${SENTINEL_KEY}" > "${SENTINEL}"
        echo "✔ Sentinel written: ${SENTINEL}"
