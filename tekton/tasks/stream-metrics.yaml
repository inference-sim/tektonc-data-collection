# tektonc-data-collection/tekton/tasks/stream-metrics.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: stream-metrics
spec:
  description: >-
    Runs llm-d-benchmark's collect_metrics.sh scraper as a Tekton
    sidecar, in parallel with the workload. Same sentinel-exit
    contract as stream-epp-logs and stream-gpu-stats: starts after
    llmdbenchmark-standup + prepare-results-dir, exits when
    collect-results writes ${RESULTS_DIR}/metrics_stream_done.

    collect_metrics.sh + process_metrics.py are pulled from raw
    GitHub at a task-param SHA — no image customization, no
    workspace mount. The scraper reads its EPP bearer token from
    the ``inference-gateway-sa-metrics-reader-secret`` Secret which
    ``cluster.py provision`` / ``cluster.py slot add`` creates
    per-namespace (annotated to helm-installer,
    ``type: kubernetes.io/service-account-token``). Cluster-scoped
    RBAC (ClusterRole + per-namespace ClusterRoleBinding) is
    created by the same admin bootstrap step from
    tekton/roles-cluster.yaml.

    Output layout (collect_metrics.sh convention):

      metrics/raw/<pod>_<timestamp>_metrics.log          Prometheus text
      metrics/raw/collection_debug.log
      metrics/processed/replica_status.json
      metrics/processed/replica_status_timeseries.json
      metrics/processed/pod_startup_times.json
      metrics/processed/metrics_summary.json

    Non-fatal: any install / fetch / discovery failure logs a warning
    and exits 0 so the pipeline is never blocked by scraper failures.

    ASSUMPTIONS:

    1. Pipeline runs under the ``helm-installer`` ServiceAccount and
       the namespace has the ``inference-gateway-sa-metrics-reader-secret``
       Secret provisioned by roles-ns.yaml. If the Secret is absent,
       ``collect_metrics.sh`` falls back to unauthenticated scrapes
       (EPP will then 401 and land in the .err file — same failure
       mode as before the RBAC fix, but bounded to EPP data loss).

    2. ClusterRole ``sim2real-metrics-reader`` and its per-namespace
       ClusterRoleBinding exist. Without them, EPP's own SA cannot
       call TokenReview / SubjectAccessReview to validate incoming
       bearer tokens and every EPP scrape 401s.

    3. Network egress from the workload pod to raw.githubusercontent.com
       for the harness-script fetch. Airgapped clusters need a mirror.

  workspaces:
    - name: data
      description: "Shared PVC (data-pvc)"

  params:
    - { name: namespace,       type: string }
    - { name: resultsDir,      type: string }
    - { name: intervalSeconds, type: string, default: "15" }
    - name: harnessSha
      type: string
      description: >-
        llm-d-benchmark git ref (SHA, tag, or branch) to fetch
        collect_metrics.sh + process_metrics.py from. Default ``main``
        gets the tip of the upstream repo; override with a pinned SHA
        for reproducible runs.
      default: "main"

  steps:
    - name: stream-metrics
      image: python:3.12-slim-bookworm
      securityContext:
        runAsUser: 0
      script: |
        #!/usr/bin/env bash
        set +e

        NAMESPACE="$(params.namespace)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        SENTINEL="${RESULTS_DIR}/metrics_stream_done"
        INTERVAL="$(params.intervalSeconds)"
        HARNESS_SHA="$(params.harnessSha)"
        KUBECTL_VER="v1.34.1"

        # ────────────────────────────────────────────────────────────
        # Phase 0 — install runtime deps we need on top of python:slim
        # ────────────────────────────────────────────────────────────
        # python:3.12-slim-bookworm ships python3 + bash + apt-get. We
        # need to add curl (for scraping /metrics and fetching the
        # harness) + kubectl (for pod discovery inside
        # collect_metrics.sh). Every install step is best-effort — if
        # egress or apt is unreachable, the task exits 0 rather than
        # blocking the pipeline.
        apt-get update -qq >/dev/null 2>&1 \
          && apt-get install -y --no-install-recommends curl >/dev/null 2>&1 || {
          echo "WARNING: apt-get install curl failed — cannot run collect_metrics.sh"
          exit 0
        }

        curl -fsSL -m 30 -o /usr/local/bin/kubectl \
          "https://dl.k8s.io/release/${KUBECTL_VER}/bin/linux/amd64/kubectl" || {
          echo "WARNING: kubectl ${KUBECTL_VER} download failed"
          exit 0
        }
        chmod +x /usr/local/bin/kubectl

        # ────────────────────────────────────────────────────────────
        # Phase 1 — fetch collect_metrics.sh + process_metrics.py
        # ────────────────────────────────────────────────────────────
        # curl -f fails on HTTP 4xx/5xx (a wrong SHA won't silently
        # produce an empty file). -m 30 caps the fetch at 30s so a
        # network stall doesn't hang the workload.
        HARNESS_URL="https://raw.githubusercontent.com/llm-d/llm-d-benchmark/${HARNESS_SHA}/workload/harnesses"
        curl -fsSL -m 30 -o /usr/local/bin/collect_metrics.sh \
          "${HARNESS_URL}/collect_metrics.sh" || {
          echo "WARNING: curl collect_metrics.sh failed (harnessSha=${HARNESS_SHA})"
          exit 0
        }
        curl -fsSL -m 30 -o /usr/local/bin/process_metrics.py \
          "${HARNESS_URL}/process_metrics.py" || {
          echo "WARNING: curl process_metrics.py failed (harnessSha=${HARNESS_SHA})"
          exit 0
        }
        chmod +x /usr/local/bin/collect_metrics.sh

        # ────────────────────────────────────────────────────────────
        # Phase 2 — env vars consumed by collect_metrics.sh
        # ────────────────────────────────────────────────────────────
        export LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR="${RESULTS_DIR}"
        export LLMDBENCH_VLLM_COMMON_NAMESPACE="${NAMESPACE}"
        export METRICS_COLLECTION_INTERVAL="${INTERVAL}"
        # Explicit default matches what roles-ns.yaml creates; downstream
        # can override if the Secret name changes.
        export LLMDBENCH_EPP_METRICS_SECRET="inference-gateway-sa-metrics-reader-secret"

        mkdir -p "${RESULTS_DIR}/metrics"
        rm -f "${SENTINEL}"
        LOG="${RESULTS_DIR}/metrics/metrics_collection.log"

        # ────────────────────────────────────────────────────────────
        # Phase 3 — start scraper in background
        # ────────────────────────────────────────────────────────────
        echo "Starting collect_metrics.sh (harnessSha=${HARNESS_SHA}, interval=${INTERVAL}s)"
        bash /usr/local/bin/collect_metrics.sh start >> "${LOG}" 2>&1 &
        SCRAPER_PID=$!
        echo "Scraper PID: ${SCRAPER_PID}"

        # ────────────────────────────────────────────────────────────
        # Phase 4 — sentinel poll
        # ────────────────────────────────────────────────────────────
        # Exits on either:
        #   (a) sentinel file appears (collect-results wrote it — the
        #       normal completion path)
        #   (b) the scraper process died on its own (fault; still exit
        #       cleanly so the workload completes)
        while true; do
          if [ -f "${SENTINEL}" ]; then
            echo "Sentinel found, stopping scraper."
            break
          fi
          if ! kill -0 "${SCRAPER_PID}" 2>/dev/null; then
            echo "Scraper process ${SCRAPER_PID} exited before sentinel."
            break
          fi
          sleep 1
        done

        # ────────────────────────────────────────────────────────────
        # Phase 5 — stop + process
        # ────────────────────────────────────────────────────────────
        # `stop` sends SIGTERM to the scraper via its PID file. `wait`
        # then reaps our background handle. `process` runs
        # process_metrics.py to aggregate raw scrapes into
        # metrics_summary.json.
        bash /usr/local/bin/collect_metrics.sh stop >> "${LOG}" 2>&1
        wait "${SCRAPER_PID}" 2>/dev/null || true
        echo "Processing collected metrics..."
        bash /usr/local/bin/collect_metrics.sh process >> "${LOG}" 2>&1

        # ────────────────────────────────────────────────────────────
        # Phase 6 — final report
        # ────────────────────────────────────────────────────────────
        n_raw=$(find "${RESULTS_DIR}/metrics/raw" -name '*_metrics.log' 2>/dev/null | wc -l | tr -d ' ')
        n_proc=$(find "${RESULTS_DIR}/metrics/processed" -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
        echo "Metrics scraping complete for $(params.resultsDir): ${n_raw} raw scrape(s), ${n_proc} processed JSON(s)"
