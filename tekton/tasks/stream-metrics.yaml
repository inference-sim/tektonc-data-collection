# tektonc-data-collection/tekton/tasks/stream-metrics.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: stream-metrics
spec:
  description: >-
    Runs llm-d-benchmark's collect_metrics.sh scraper as a Tekton
    sidecar, in parallel with the workload. Same sentinel-exit
    contract as stream-epp-logs and stream-gpu-stats: starts after
    llmdbenchmark-standup + prepare-results-dir, exits when
    collect-results writes ${RESULTS_DIR}/metrics_stream_done.

    collect_metrics.sh + process_metrics.py are pulled from raw
    GitHub at a task-param SHA — no image customization, no
    workspace mount. The scraper reads its EPP bearer token from
    the ``inference-gateway-sa-metrics-reader-secret`` Secret which
    ``cluster.py provision`` / ``cluster.py slot add`` creates
    per-namespace (annotated to helm-installer,
    ``type: kubernetes.io/service-account-token``). Cluster-scoped
    RBAC (ClusterRole + per-namespace ClusterRoleBinding) is
    created by the same admin bootstrap step from
    tekton/roles-cluster.yaml.

    Output layout (collect_metrics.sh convention):

      metrics/raw/<pod>_<timestamp>_metrics.log          Prometheus text
      metrics/raw/collection_debug.log
      metrics/processed/replica_status.json
      metrics/processed/replica_status_timeseries.json
      metrics/processed/pod_startup_times.json
      metrics/processed/metrics_summary.json

    Non-fatal: any install / fetch / discovery failure logs a warning
    and exits 0 so the pipeline is never blocked by scraper failures.

    ASSUMPTIONS:

    1. Pipeline runs under the ``helm-installer`` ServiceAccount and
       the namespace has the ``inference-gateway-sa-metrics-reader-secret``
       Secret provisioned by roles-ns.yaml. If the Secret is absent,
       ``collect_metrics.sh`` falls back to unauthenticated scrapes
       (EPP will then 401 and land in the .err file — same failure
       mode as before the RBAC fix, but bounded to EPP data loss).

    2. ClusterRole ``sim2real-metrics-reader`` and its per-namespace
       ClusterRoleBinding exist. Without them, EPP's own SA cannot
       call TokenReview / SubjectAccessReview to validate incoming
       bearer tokens and every EPP scrape 401s.

    3. Network egress from the workload pod to raw.githubusercontent.com
       for the harness-script fetch. Airgapped clusters need a mirror.

  volumes:
    # Per-Pod scratch for the staged kubectl binary: shared by every step of the
    # Task, gone when the Pod is. Deliberately not the data workspace — that is
    # the results PVC, and a binary written there would sit inside the tree
    # `deploy.py collect` walks and ship to the operator with the results.
    - name: tools
      emptyDir: {}

  workspaces:
    - name: data
      description: "Shared PVC (data-pvc)"

  params:
    - { name: namespace,       type: string }
    - { name: resultsDir,      type: string }
    - { name: intervalSeconds, type: string, default: "15" }
    - name: harnessSha
      type: string
      description: >-
        llm-d-benchmark git ref (SHA, tag, or branch) to fetch
        collect_metrics.sh + process_metrics.py from. Default ``main``
        gets the tip of the upstream repo; override with a pinned SHA
        for reproducible runs.
      default: "main"

  steps:
    # ────────────────────────────────────────────────────────────
    # Stage kubectl for the step below
    # ────────────────────────────────────────────────────────────
    # The next step needs both python3 and kubectl. It runs on python:slim, which
    # has no kubectl; this step runs on an image that does and hands the binary
    # over on the shared `tools` volume, which every step of a Task can see
    # because Tekton runs them as containers in one Pod.
    #
    # Crossing images works only because kubectl is statically linked — a
    # dynamically-linked binary could not run on both Alpine/musl and
    # Debian/glibc. The version check below is what proves the copy is usable.
    #
    # alpine/kubectl:1.34.1 is the image stream-epp-logs, stream-gpu-stats and
    # collect-results already use, so its layers are usually node-cached and the
    # version matches theirs.
    #
    # Best-effort, like every install in this Task: exit 0 on failure and let the
    # step below record it, since this step cannot write the results marker.
    - name: stage-kubectl
      image: alpine/kubectl:1.34.1
      volumeMounts:
        - name: tools
          mountPath: /tools
      script: |
        #!/bin/sh
        set +e
        SRC="$(command -v kubectl)"
        if [ -z "${SRC}" ]; then
          echo "WARNING: no kubectl in alpine/kubectl image — nothing to stage"
          exit 0
        fi
        cp "${SRC}" /tools/kubectl || {
          echo "WARNING: could not copy kubectl to the tools volume"
          exit 0
        }
        chmod +x /tools/kubectl
        # Prove the staged copy actually runs before the next step depends on it.
        # --client so this needs no cluster credentials.
        /tools/kubectl version --client 2>&1 | head -2 \
          || echo "WARNING: staged kubectl did not execute"

    - name: stream-metrics
      image: python:3.12-slim-bookworm
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: tools
          mountPath: /tools
      script: |
        #!/usr/bin/env bash
        set +e

        NAMESPACE="$(params.namespace)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        SENTINEL="${RESULTS_DIR}/metrics_stream_done"
        INTERVAL="$(params.intervalSeconds)"
        HARNESS_SHA="$(params.harnessSha)"
        # kubectl comes from the stage-kubectl step's image via the shared
        # `tools` volume, not from a download. Putting /tools first means the
        # staged copy wins over anything the base image might ship later.
        export PATH="/tools:${PATH}"

        # Clear a stale sentinel from a previous attempt on a re-used results
        # dir. Nothing else does: prepare-results-dir only mkdir -p's, and
        # collect-results clears in the same step that later writes it.
        #
        # Must happen before the bootstrap below, not just before the poll loop.
        # collect-results runs in parallel and writes the sentinel when the
        # workload ends; if that lands while this step is still installing, a
        # later clear deletes it with nothing left to re-create it and the poll
        # loop runs to the TaskRun timeout.
        rm -f "${SENTINEL}"

        # ────────────────────────────────────────────────────────────
        # Phase 0 — install runtime deps we need on top of python:slim
        # ────────────────────────────────────────────────────────────
        # This step needs python3 throughout, not just at the end:
        # collect_metrics.sh shells out to it on every sample
        # (collect_replica_status, collect_pod_startup_times) as well as for the
        # final aggregation. That is why python:slim is the base image and why
        # python and kubectl cannot be split into separate steps by phase.
        #
        # curl is the only install left: collect_metrics.sh scrapes /metrics with
        # it and the harness files are fetched with it. Best-effort — if egress or
        # apt is unreachable the task exits 0 rather than blocking the pipeline
        # (the non-fatal-streamer contract).
        #
        # A bootstrap failure is ALSO recorded in the results tree. Exiting
        # 0 on stdout alone makes "metrics collected" and "metrics never
        # started" indistinguishable after the fact: a run whose scraper
        # never ran looks identical to one with no load. 
        bootstrap_fail() {
          echo "WARNING: $1"
          mkdir -p "${RESULTS_DIR}" 2>/dev/null
          {
            echo "stream-metrics bootstrap failed: $1"
            echo "when:        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "harnessSha:  ${HARNESS_SHA}"
            echo "kubectl:     $(command -v kubectl 2>/dev/null || echo MISSING)"
            echo "consequence: no metrics/ output for this iteration"
          } > "${RESULTS_DIR}/metrics_bootstrap_failed" 2>/dev/null
          exit 0
        }

        apt-get update -qq >/dev/null 2>&1 \
          && apt-get install -y --no-install-recommends curl >/dev/null 2>&1 || {
          bootstrap_fail "apt-get install curl failed — cannot run collect_metrics.sh"
        }

        # kubectl comes from the stage-kubectl step, which is best-effort, so
        # confirm it landed. Failing here records a marker in the results tree;
        # letting collect_metrics.sh hit it instead surfaces only as per-sample
        # errors buried in the log.
        command -v kubectl >/dev/null 2>&1 || {
          bootstrap_fail "kubectl not on PATH — the stage-kubectl step did not produce /tools/kubectl"
        }

        # ────────────────────────────────────────────────────────────
        # Phase 1 — fetch collect_metrics.sh + process_metrics.py
        # ────────────────────────────────────────────────────────────
        # curl -f fails on HTTP 4xx/5xx (a wrong SHA won't silently
        # produce an empty file). -m 30 caps the fetch at 30s so a
        # network stall doesn't hang the workload.
        HARNESS_URL="https://raw.githubusercontent.com/llm-d/llm-d-benchmark/${HARNESS_SHA}/workload/harnesses"
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -m 30 \
          -o /usr/local/bin/collect_metrics.sh \
          "${HARNESS_URL}/collect_metrics.sh" || {
          bootstrap_fail "curl collect_metrics.sh failed (harnessSha=${HARNESS_SHA})"
        }
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -m 30 \
          -o /usr/local/bin/process_metrics.py \
          "${HARNESS_URL}/process_metrics.py" || {          bootstrap_fail "curl process_metrics.py failed (harnessSha=${HARNESS_SHA})"
        }
        chmod +x /usr/local/bin/collect_metrics.sh

        # Set-based selector, matching stream-gpu-stats and collect-results: any
        # pod with role in (decode, prefill). Single-quoted in the kubectl arg so
        # the spaces and parens reach kubectl intact. Drives Phase 4's
        # workload-disappeared exit.
        discover_vllm_pods() {
          kubectl get pods -n "${NAMESPACE}" \
            -l 'llm-d.ai/role in (decode,prefill)' \
            --field-selector=status.phase=Running \
            --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null
        }

        # ────────────────────────────────────────────────────────────
        # Phase 2 — env vars consumed by collect_metrics.sh
        # ────────────────────────────────────────────────────────────
        export LLMDBENCH_RUN_EXPERIMENT_RESULTS_DIR="${RESULTS_DIR}"
        export LLMDBENCH_VLLM_COMMON_NAMESPACE="${NAMESPACE}"
        export METRICS_COLLECTION_INTERVAL="${INTERVAL}"
        # Explicit default matches what roles-ns.yaml creates; downstream
        # can override if the Secret name changes.
        export LLMDBENCH_EPP_METRICS_SECRET="inference-gateway-sa-metrics-reader-secret"

        mkdir -p "${RESULTS_DIR}/metrics"
        LOG="${RESULTS_DIR}/metrics/metrics_collection.log"

        # ────────────────────────────────────────────────────────────
        # Phase 3 — start scraper in background
        # ────────────────────────────────────────────────────────────
        echo "Starting collect_metrics.sh (harnessSha=${HARNESS_SHA}, interval=${INTERVAL}s)"
        bash /usr/local/bin/collect_metrics.sh start >> "${LOG}" 2>&1 &
        SCRAPER_PID=$!
        echo "Scraper PID: ${SCRAPER_PID}"

        # ────────────────────────────────────────────────────────────
        # Phase 4 — sentinel poll
        # ────────────────────────────────────────────────────────────
        # Exits on any of:
        #   (a) the sentinel appears — collect-results wrote it, the normal
        #       completion path.
        #   (b) no running vLLM pods remain — the workload ended without the
        #       sentinel reaching us. stream-epp-logs and stream-gpu-stats carry
        #       the same exit. It is not redundant with (a): a sentinel can be
        #       written and then lost, and without (b) the loop would then run to
        #       the TaskRun timeout.
        #   (c) the scraper died on its own. A fault path only —
        #       collect_metrics.sh loops forever, so a healthy scraper never
        #       exits here and (c) cannot stand in for (b).
        #
        # The pod probe runs every RE_RESOLVE_EVERY iterations so a 1s sentinel
        # poll does not become a 1s kubectl call.
        RE_RESOLVE_EVERY=30
        iter=0
        while true; do
          if [ -f "${SENTINEL}" ]; then
            echo "Sentinel found, stopping scraper."
            break
          fi
          if ! kill -0 "${SCRAPER_PID}" 2>/dev/null; then
            echo "Scraper process ${SCRAPER_PID} exited before sentinel."
            break
          fi
          iter=$((iter+1))
          if [ $((iter % RE_RESOLVE_EVERY)) -eq 0 ]; then
            if [ -z "$(discover_vllm_pods)" ]; then
              echo "No running vLLM pods remain, stopping scraper."
              break
            fi
          fi
          sleep 1
        done

        # ────────────────────────────────────────────────────────────
        # Phase 5 — stop + process
        # ────────────────────────────────────────────────────────────
        # `stop` sends SIGTERM to the scraper via its PID file. `wait`
        # then reaps our background handle. `process` runs
        # process_metrics.py to aggregate raw scrapes into
        # metrics_summary.json.
        bash /usr/local/bin/collect_metrics.sh stop >> "${LOG}" 2>&1
        wait "${SCRAPER_PID}" 2>/dev/null || true
        echo "Processing collected metrics..."
        bash /usr/local/bin/collect_metrics.sh process >> "${LOG}" 2>&1

        # ────────────────────────────────────────────────────────────
        # Phase 6 — final report
        # ────────────────────────────────────────────────────────────
        n_raw=$(find "${RESULTS_DIR}/metrics/raw" -name '*_metrics.log' 2>/dev/null | wc -l | tr -d ' ')
        n_proc=$(find "${RESULTS_DIR}/metrics/processed" -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
        echo "Metrics scraping complete for $(params.resultsDir): ${n_raw} raw scrape(s), ${n_proc} processed JSON(s)"
