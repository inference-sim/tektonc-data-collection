# tektonc-data-collection/tekton/tasks/prepare-trace.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-trace
spec:
  description: >-
    Prepare a recorded TraceV2 corpus on the data PVC for trace-input observe
    (inference-sim/tektonc-data-collection#62). Short-circuits when traceSpec is
    empty (generative workload) or when the target TraceV2 is already cached on
    the PVC. Otherwise runs the corpus->TraceV2 chain: download corpus parquet
    shards from the public HF dataset (if absent) -> build OTel JSONL (inline
    port of build_otel_corpus.py: usable-span + min_rounds filter, deterministic
    SHA1 train/test split; no branching filter, see #63) -> blis convert otel.
    Every field the steps need arrives as a SEPARATE SCALAR param (traceSource,
    traceShards, traceMinRounds, traceSplit, traceContextGrowth) so no
    in-container YAML parsing of the compact traceSpec is required. One task,
    guarded steps; every step no-ops when the guard marker is present, so a
    generative run's pod starts and exits in seconds.

  params:
    - name: traceSpec
      type: string
      default: ""
      description: >-
        Compact-YAML trace descriptor emitted by assemble. Used ONLY as the
        empty/non-empty presence signal (empty => generative workload => skip);
        the steps never parse it — see the traceSource/traceShards/... scalars.
    - name: tracePath
      type: string
      default: ""
      description: >-
        Relative path under /workspace/data for the output TraceV2; the chain
        writes <tracePath>.yaml + <tracePath>.csv. Hash-derived by assemble, so
        identical descriptors reuse the cache and changed ones bust it.
    - name: traceSource
      type: string
      default: ""
      description: >-
        HF dataset ref for the corpus (e.g. "hf:Exgentic/agent-llm-traces"). A
        leading "hf:" prefix is stripped to form the <org>/<name> repo path.
    - name: traceShards
      type: string
      default: ""
      description: 'Number of parquet shards to download (default 39 when empty).'
    - name: traceMinRounds
      type: string
      default: ""
      description: >-
        Minimum usable spans per session to keep it (default 2 when empty).
    - name: traceSplit
      type: string
      default: ""
      description: >-
        Deterministic SHA1 split to select: test | train | all (default test).
    - name: traceContextGrowth
      type: string
      default: ""
      description: >-
        context_growth mode passed to `blis convert otel` (default accumulate).

  workspaces:
    - name: data
      description: "Shared PVC: corpus cache + output TraceV2 (data-pvc)"
    - name: source
      description: "Shared PVC: blis binary (source-pvc)"

  steps:
    # ---- guard: the two short-circuit conditions (issue #62) ----
    - name: guard
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -e
        rm -f /workspace/skip
        if [ -z "$(params.traceSpec)" ]; then
          echo "prepare-trace: no traceSpec (generative workload) — skipping"
          touch /workspace/skip
          exit 0
        fi
        if [ -f "/workspace/data/$(params.tracePath).yaml" ] && \
           [ -f "/workspace/data/$(params.tracePath).csv" ]; then
          echo "prepare-trace: TraceV2 already cached at $(params.tracePath) — skipping"
          touch /workspace/skip
          exit 0
        fi
        echo "prepare-trace: building TraceV2 at $(params.tracePath)"

    # ---- step 1: download corpus parquet shards if absent ----
    # Public HF dataset (no auth): the shards live at the resolve/main URL under
    # data/train-<NNNNN>-of-<TOTAL>.parquet. Repo + shard count arrive as scalar
    # params — no YAML parsing. Idempotent: skips when the expected shard count
    # is already present on the PVC.
    - name: download-corpus
      image: curlimages/curl:8.11.0
      script: |
        #!/bin/sh
        set -e
        [ -f /workspace/skip ] && { echo "skip"; exit 0; }
        REPO="$(params.traceSource)"
        REPO=${REPO#hf:}                # strip hf: prefix -> <org>/<name>
        SHARDS="$(params.traceShards)"
        : "${SHARDS:=39}"
        CORPUS=/workspace/data/corpus
        mkdir -p "${CORPUS}"
        TOTAL=$(printf '%05d' "${SHARDS}")
        have=$(ls -1 "${CORPUS}"/*.parquet 2>/dev/null | wc -l | tr -d ' ')
        if [ "${have}" -ge "${SHARDS}" ]; then
          echo "download-corpus: ${have} parquet file(s) already at ${CORPUS} — skipping"
          exit 0
        fi
        i=0
        while [ "$i" -lt "${SHARDS}" ]; do
          FN="train-$(printf '%05d' "$i")-of-${TOTAL}.parquet"
          DEST="${CORPUS}/${FN}"
          if [ -f "${DEST}" ]; then
            echo "have ${FN}"
          else
            URL="https://huggingface.co/datasets/${REPO}/resolve/main/data/${FN}"
            echo "downloading ${URL}"
            curl -fsSL "${URL}" -o "${DEST}.tmp"
            mv "${DEST}.tmp" "${DEST}"
          fi
          i=$((i + 1))
        done
        echo "download-corpus: ${SHARDS} shard(s) present in ${CORPUS}"

    # ---- step 2: parquet -> OTel JSONL (inline port of build_otel_corpus.py) ----
    # No branching filter — Exgentic has no branch structure; see
    # inference-sim/tektonc-data-collection#63. The python program is embedded as
    # a quoted heredoc so no shell interpolation touches it; MIN_ROUNDS/SPLIT are
    # passed via env from scalar params (no YAML read). The sh wrapper only
    # early-exits on the guard marker and installs the parquet dep.
    - name: build-otel
      image: python:3.11-slim
      script: |
        #!/bin/sh
        set -e
        [ -f /workspace/skip ] && { echo "skip"; exit 0; }
        pip install --quiet pyarrow
        export MIN_ROUNDS="$(params.traceMinRounds)"
        export SPLIT="$(params.traceSplit)"
        python3 - <<'PYEOF'
        import glob, hashlib, json, os, sys
        import pyarrow.parquet as pq

        CORPUS  = "/workspace/data/corpus"
        OUT_DIR = "/workspace/data/otel"
        OUT     = os.path.join(OUT_DIR, "corpus.jsonl")
        TEST_PCT = 30  # campaign convention (build_otel_corpus.py --test-pct default)

        min_rounds = int(os.environ.get("MIN_ROUNDS") or 2)
        split = (os.environ.get("SPLIT") or "test").lower()

        def usable_spans(spans):
            # Keep only spans with ground-truth token counts on both sides
            # (BA-2: output/input < 1 would panic the decode model at replay).
            out = []
            for s in spans:
                a = s.get("attributes") or {}
                it = a.get("gen_ai.usage.input_tokens", 0) or 0
                ot = a.get("gen_ai.usage.output_tokens", 0) or 0
                if it >= 1 and ot >= 1:
                    out.append(s)
            return out

        def in_split(sid):
            # Deterministic SHA1(session_id)%100 split (no RNG): test if < TEST_PCT.
            h = int(hashlib.sha1(sid.encode()).hexdigest(), 16) % 100
            if split == "all":
                return True
            if split == "train":
                return h >= TEST_PCT
            return h < TEST_PCT  # "test" (default)

        os.makedirs(OUT_DIR, exist_ok=True)
        files = sorted(glob.glob(os.path.join(CORPUS, "*.parquet")))
        scanned = kept = dropped = selected = 0
        with open(OUT, "w") as fout:
            for f in files:
                for r in pq.read_table(f).to_pylist():
                    scanned += 1
                    sid = r["session_id"]
                    spans = usable_spans(list(r["spans"]))
                    if len(spans) < min_rounds:
                        dropped += 1
                        continue
                    kept += 1
                    if not in_split(sid):
                        continue
                    selected += 1
                    # Order each session's spans by start_time. (blis convert
                    # otel re-sorts internally, so this is belt-and-suspenders.)
                    spans = sorted(spans, key=lambda s: s["start_time"])
                    rec_spans = []
                    for s in spans:
                        a = s["attributes"]
                        rec_spans.append({
                            "span_id": s["span_id"],
                            "name": s.get("name", "chat"),
                            "start_time": s["start_time"],
                            "status": {"code": 1},
                            "attributes": {
                                "gen_ai.request.model": a.get("gen_ai.request.model", "model"),
                                "gen_ai.usage.input_tokens": int(a["gen_ai.usage.input_tokens"]),
                                "gen_ai.usage.output_tokens": int(a["gen_ai.usage.output_tokens"]),
                            },
                            "trace_id": sid,
                        })
                    fout.write(json.dumps({"spans": rec_spans}) + "\n")
        print("build-otel: scanned=%d kept(>=%d usable)=%d dropped(<%d)=%d split=%s selected=%d"
              % (scanned, min_rounds, kept, min_rounds, dropped, split, selected))
        print("build-otel: wrote %s" % OUT)
        if selected == 0:
            sys.exit("build-otel: no sessions selected for split %r — nothing to convert" % split)
        PYEOF
        echo "OTel JSONL written to /workspace/data/otel/corpus.jsonl"

    # ---- step 3: OTel JSONL -> TraceV2 (blis convert otel) ----
    - name: convert
      image: debian:bookworm-slim
      script: |
        #!/bin/sh
        set -e
        [ -f /workspace/skip ] && { echo "skip"; exit 0; }
        BLIS="$(workspaces.source.path)/blis/blis"
        CG="$(params.traceContextGrowth)"
        : "${CG:=accumulate}"
        OUT="/workspace/data/$(params.tracePath)"
        "${BLIS}" convert otel \
          --input /workspace/data/otel/corpus.jsonl \
          --context-growth "${CG}" \
          --trace-output "${OUT}"
        if [ ! -f "${OUT}.yaml" ] || [ ! -f "${OUT}.csv" ]; then
          echo "ERROR: expected ${OUT}.yaml and ${OUT}.csv after conversion" >&2
          exit 1
        fi
        echo "TraceV2 written: ${OUT}.{yaml,csv}"
        ls -la "${OUT}.yaml" "${OUT}.csv"
