# tektonc-data-collection/tekton/tasks/prepare-trace.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-trace
spec:
  description: >-
    Prepare a recorded TraceV2 corpus on the data PVC for trace-input observe
    (inference-sim/tektonc-data-collection#62). Short-circuits when traceSpec is
    empty (generative workload) or when the target TraceV2 is already cached on
    the PVC. Otherwise runs the corpus->TraceV2 chain, which the traceFormat
    param SELECTS (#68) — both branches DISCOVER and download from the HF dataset
    via huggingface_hub (layout-agnostic — both sharded-split and
    split-as-directory work; #67) into a corpus dir keyed by
    <repo>@<resolved-sha> so two datasets or revisions never share a cache, then:

      otel-parquet (default): .parquet -> build OTel JSONL (inline port of
        build_otel_corpus.py: usable-span + min_rounds filter, deterministic SHA1
        train/test split; no branching filter, see #63; streamed with column
        projection so peak memory is bounded by batch size rather than shard
        size) -> blis convert otel
      weka-jsonl: .jsonl -> blis convert weka (build-otel is SKIPPED — JSONL is
        already blis's native Weka shape)

    KNOWN GAP on the weka-jsonl path: build-otel is what applies traceSplit,
    traceDedupByConversation and traceShuffleSeed, and it is skipped for
    weka-jsonl. `blis convert weka` has no flag for any of the three and does no
    internal equivalent (verified at pin 602ae462), so those three fields have NO
    EFFECT on a weka corpus. Only traceMinRounds could be rescued, by threading
    it to the converter, which the convert step does. This task cannot detect the
    difference between an operator asking for a shuffle and sim2real emitting its
    default, since both arrive as a non-empty param — so the rejection has to
    live at assemble time — sim2real #901 states the "applied or rejected"
    invariant, but the rule itself belongs to sim2real #905, which is where
    traceFormat becomes legal and therefore where a weka-conditional rejection
    first becomes reachable at all. Not
    fixable here: it needs either weka-side flags in blis or a filter step of its
    own, both outside #68.

    Every field the steps need arrives as a SEPARATE SCALAR param (traceFormat,
    traceSource, traceRevision, traceShards, traceMinRounds, traceSplit,
    traceContextGrowth, traceMaxThinkTime) so no in-container YAML
    parsing of the compact traceSpec is required. One task,
    guarded steps; every step no-ops when the guard marker is present, so a
    generative run's pod starts and exits in seconds.

  params:
    - name: traceSpec
      type: string
      default: ""
      description: >-
        Compact-YAML trace descriptor emitted by assemble. Used ONLY as the
        empty/non-empty presence signal (empty => generative workload => skip);
        the steps never parse it — see the traceSource/traceShards/... scalars.
    - name: tracePath
      type: string
      default: ""
      description: >-
        Relative path under /workspace/data for the output TraceV2; the chain
        writes <tracePath>.yaml + <tracePath>.csv. Hash-derived by assemble, so
        identical descriptors reuse the cache and changed ones bust it.
    - name: traceSource
      type: string
      default: ""
      description: >-
        HF dataset ref for the corpus (e.g. "hf:Exgentic/agent-llm-traces"). A
        leading "hf:" prefix is stripped to form the <org>/<name> repo path.
    - name: traceShards
      type: string
      default: ""
      description: >-
        DEPRECATED cap on the number of parquet files to fetch: after the
        dataset's files are DISCOVERED, the sorted list is truncated to the
        first N. Empty (the default) fetches all discovered files. Retained
        because sim2real's pipeline.yaml passes it; a shard *prefix* is a
        benchmark-biased subsample, not a random one (for
        Exgentic/agent-llm-traces: shards 0-1 appworld, 13 swebench, 20
        swebench+tau2_airline, 26 tau2_retail, 38 tau2_telecom), so prefer
        deliberate selection once the descriptor grows include patterns.
    - name: traceRevision
      type: string
      default: ""
      description: >-
        Optional git revision (branch, tag, or commit SHA) of the HF dataset to
        fetch. Empty (the default) means the repo's default branch. The step
        RESOLVES this to a commit SHA and keys the on-PVC corpus directory by
        it, so a moving ref that advances upstream lands in a fresh directory
        instead of mixing with the previously downloaded files.
        NOTE: sim2real does not emit this param yet, so today it is always ""
        — the plumbing is here, but pinning is not reachable from a descriptor
        until the paired sim2real change lands.
    - name: traceFormat
      type: string
      default: "otel-parquet"
      description: >-
        Upstream corpus format, which selects the whole chain (#68):
        "otel-parquet" discovers .parquet files, runs build-otel, and converts
        with `blis convert otel`; "weka-jsonl" discovers .jsonl files, SKIPS
        build-otel (JSONL is blis's native Weka shape), and converts with
        `blis convert weka`. An unrecognised value fails in the guard step.
        Defaults to otel-parquet so a descriptor that predates this param keeps
        today's behaviour exactly.
        NOTE: sim2real does not emit this param yet, so today it is always
        "otel-parquet" — same dormancy as traceRevision above. Reaching a Weka
        corpus from a descriptor needs sim2real #905, which is what emits this
        param; #901 defines the descriptor schema and the content-addressed cache
        key it is folded into, and states the "applied or rejected" invariant.
        Rejecting an unknown value at assemble time lands with the emit, in #905.
    - name: traceMaxThinkTime
      type: string
      default: ""
      description: >-
        Cap on the per-round client think gap, passed to the converter as
        --max-think-time (e.g. "15s", "0" for no cap). Empty (the default)
        OMITS the flag, so each converter applies its own default — which
        DIFFER, and in opposite directions: `convert otel` caps at 15s while
        `convert weka` does not cap at all (0). Omitting rather than picking one
        is deliberate: any single default here would silently change one of the
        two paths. Per #68 the assembler is what must emit an explicit value on
        every path so no converter default ever applies; until sim2real does
        (#901), leaving this empty preserves each path's current behaviour.
    - name: traceMinRounds
      type: string
      default: ""
      description: >-
        Minimum usable spans per session to keep it (default 2 when empty).
        On the otel-parquet path build-otel enforces this. On the weka-jsonl
        path build-otel is skipped, so it is threaded to `blis convert weka`
        as --min-rounds instead — the field stays live on both paths rather
        than silently going inert for weka.
    - name: traceSplit
      type: string
      default: ""
      description: >-
        Deterministic SHA1 split to select: test | train | all (default test).
        OTEL-PARQUET ONLY. build-otel applies this, and build-otel is skipped for
        weka-jsonl; `blis convert weka` has no split flag and does no internal
        equivalent, so on that path the WHOLE corpus is used regardless of this
        value. sim2real must reject the field for weka-jsonl rather than accept
        it silently — #901's invariant, enforced in #905. See the header note.
    - name: traceContextGrowth
      type: string
      default: ""
      description: >-
        Prefix model passed to the converter as --context-growth: "accumulate"
        (default) or "independent". Applies on BOTH paths — `convert otel` and
        `convert weka` each take the flag, with the same default — so unlike
        traceSplit/traceDedupByConversation/traceShuffleSeed this field does not
        go inert for weka. The convert step passes it explicitly either way.
    - name: traceDedupByConversation
      type: string
      default: "1"
      description: >-
        When truthy (default), keep at most ONE session per conversation
        (the 12-hex prefix of session_id before '_'), so the corpus is one
        independent multi-turn session per conversation rather than many
        correlated sub-sessions of the same conversation. "0"/""/"false" = keep all.
        OTEL-PARQUET ONLY — see traceSplit; no weka equivalent exists, so a weka
        corpus keeps every session.
    - name: traceShuffleSeed
      type: string
      default: "42"
      description: >-
        Seed for the deterministic shuffle of the selected sessions. Breaks the
        conversation-contiguous file order so `blis observe`'s first-N pool spans
        many conversations. Same seed => identical corpus across arms/reruns.
        OTEL-PARQUET ONLY — see traceSplit. This is the most consequential of the
        three: unshuffled, a weka corpus stays in its on-disk order, so an
        observe pool that takes the first N sessions draws a correlated sample
        rather than one spanning the corpus. That is a measurement-validity
        problem, not a cosmetic gap.

  workspaces:
    - name: data
      description: "Shared PVC: corpus cache + output TraceV2 (data-pvc)"
    - name: source
      description: "Shared PVC: blis binary (source-pvc)"

  steps:
    # ---- guard: the two short-circuit conditions (issue #62) ----
    - name: guard
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -e
        rm -f /workspace/skip
        rm -f /workspace/skip_build_otel
        if [ -z "$(params.traceSpec)" ]; then
          echo "prepare-trace: no traceSpec (generative workload) — skipping"
          touch /workspace/skip
          exit 0
        fi
        # Validate the format before anything reads the PVC. This is an in-pod
        # BACKSTOP, not the real gate: #68 puts the authoritative check at
        # assemble time in sim2real, which can reject the descriptor before a
        # slot is ever consumed. Checked ahead of the cache probe so a typo
        # fails loudly rather than silently reusing a corpus built from a
        # different chain.
        FORMAT="$(params.traceFormat)"
        : "${FORMAT:=otel-parquet}"
        case "${FORMAT}" in
          otel-parquet|weka-jsonl) ;;
          *) echo "prepare-trace: unknown traceFormat '${FORMAT}' —" \
                  "expected otel-parquet or weka-jsonl" >&2
             exit 1 ;;
        esac
        # build-otel is an OTel-only step: for weka-jsonl the downloaded JSONL is
        # already blis's native Weka shape and goes straight to the converter.
        # Published as its own marker so build-otel does not need to re-derive
        # the format. (download-corpus and convert do each interpret traceFormat
        # themselves — they need the extension and the subcommand respectively.)
        if [ "${FORMAT}" != "otel-parquet" ]; then
          touch /workspace/skip_build_otel
        fi
        echo "prepare-trace: format=${FORMAT}"
        # Say out loud which descriptor fields this format ignores. Deliberately
        # UNCONDITIONAL: the params always arrive non-empty (traceSplit "test",
        # traceDedupByConversation "1", traceShuffleSeed "42" are sim2real's
        # defaults), so the step cannot tell a deliberate value from a default and
        # must not pretend to. Stating the fact claims nothing about intent, and
        # without it a weka run's log looks completely normal while three hashed
        # fields did nothing — see the KNOWN GAP note in the task description.
        if [ "${FORMAT}" = "weka-jsonl" ]; then
          echo "prepare-trace: NOTE weka-jsonl ignores traceSplit," \
               "traceDedupByConversation and traceShuffleSeed — build-otel applies" \
               "those and is skipped on this path, and blis convert weka has no" \
               "equivalent. The corpus is unsplit, undeduplicated and in on-disk" \
               "order, so an observe pool taking the first N sessions draws a" \
               "correlated sample. See #68." >&2
        fi
        if [ -f "/workspace/data/$(params.tracePath).yaml" ] && \
           [ -f "/workspace/data/$(params.tracePath).csv" ]; then
          echo "prepare-trace: TraceV2 already cached at $(params.tracePath) — skipping"
          touch /workspace/skip
          exit 0
        fi
        echo "prepare-trace: building TraceV2 at $(params.tracePath)"

    # ---- step 1: discover + download the corpus files if absent ----
    # Layout-agnostic (#67): the file list is DISCOVERED from the HF repo rather
    # than synthesized from a shard-count format, so both of HF's standard
    # layouts work — sharded-split (data/train-00000-of-00039.parquet) and
    # split-as-directory (data/train/0000.parquet).
    #
    # Which EXTENSION is discovered is format-driven (#68): .parquet for
    # otel-parquet, .jsonl for weka-jsonl. Everything else about the step —
    # revision resolution, the <repo>@<sha> corpus key, per-file idempotency —
    # is format-independent.
    #
    # The corpus directory is keyed by <repo>@<resolved-sha>, which is what makes
    # revision pinning meaningful and what stops two datasets from colliding:
    # the previous fixed /workspace/data/corpus plus a count-based guard let a
    # 9-file v2 descriptor see v1's 39 files, skip the download, and silently
    # convert v1 data. Idempotency is now per FILE against the discovered list,
    # which is sound however the shard counts differ.
    - name: download-corpus
      image: python:3.11-slim
      script: |
        #!/bin/sh
        set -e
        [ -f /workspace/skip ] && { echo "skip"; exit 0; }
        # Floor is for local_dir= writing REAL files rather than cache symlinks
        # (huggingface_hub 0.23+); 0.34 is simply a recent, well-tested release.
        # Nothing here shells out to the `hf` CLI — the step uses the Python API
        # (HfApi.dataset_info / list_repo_files / hf_hub_download) throughout.
        pip install --quiet 'huggingface_hub>=0.34'
        export REPO="$(params.traceSource)"
        export REV="$(params.traceRevision)"
        export SHARDS="$(params.traceShards)"
        export FORMAT="$(params.traceFormat)"
        python3 - <<'PYEOF'
        import os
        import re
        import sys

        from huggingface_hub import HfApi, hf_hub_download

        repo = (os.environ.get("REPO") or "").strip()
        repo = repo[3:] if repo.startswith("hf:") else repo   # strip hf: prefix
        if not repo:
            sys.exit("download-corpus: traceSource is empty — nothing to fetch")
        rev = (os.environ.get("REV") or "").strip() or None
        shards_raw = (os.environ.get("SHARDS") or "").strip()
        shards = int(shards_raw) if shards_raw else 0        # 0 / empty => all

        # The discovery filter is format-driven (#68). Before this, the filter was
        # a hardcoded ".parquet", so a weka-jsonl descriptor died right here with
        # "no .parquet files found" — ahead of every other step the format
        # dispatch touches. The guard step has already rejected any value not in
        # this table, so a KeyError here would mean the two have drifted apart.
        EXTENSIONS = {"otel-parquet": ".parquet", "weka-jsonl": ".jsonl"}
        fmt = (os.environ.get("FORMAT") or "").strip() or "otel-parquet"
        try:
            ext = EXTENSIONS[fmt]
        except KeyError:
            sys.exit("download-corpus: unknown format %r (expected one of %s) — "
                     "guard step should have caught this"
                     % (fmt, ", ".join(sorted(EXTENSIONS))))

        api = HfApi()
        # Resolve the ref to a commit SHA so a moving ref (e.g. "main") that
        # advances upstream lands in a NEW corpus dir instead of mixing files.
        info = api.dataset_info(repo, revision=rev)
        sha = info.sha
        if not sha:
            sys.exit("download-corpus: could not resolve a commit sha for "
                     "%s@%s" % (repo, rev or "<default>"))

        # Discover, don't synthesize. Sorted so the deprecated shard cap is
        # deterministic.
        files = sorted(
            f for f in api.list_repo_files(repo, repo_type="dataset", revision=sha)
            if f.endswith(ext)
        )
        if not files:
            sys.exit("download-corpus: no %s files found in %s@%s (format=%s)"
                     % (ext, repo, sha, fmt))
        discovered = len(files)
        if shards > 0:
            files = files[:shards]

        # <repo>@<sha>, with the repo's "/" and anything else awkward flattened.
        slug = re.sub(r"[^A-Za-z0-9._-]", "_", repo)
        corpus = "/workspace/data/corpus/%s@%s" % (slug, sha)
        os.makedirs(corpus, exist_ok=True)

        # Per-file idempotency against the discovered list. The old guard
        # compared a bare COUNT against the requested shard count, which is
        # unsound in both directions once shard counts vary between datasets.
        missing = [f for f in files
                   if not os.path.exists(os.path.join(corpus, f))]
        print("download-corpus: %s@%s discovered=%d selected=%d present=%d "
              "missing=%d shard_cap=%s"
              % (repo, sha, discovered, len(files), len(files) - len(missing),
                 len(missing), shards or "none"))
        for f in missing:
            print("downloading %s" % f)
            # local_dir= writes REAL files (not cache symlinks) and PRESERVES
            # repo structure, so a split-as-directory dataset lands at
            # <corpus>/data/train/0000.parquet — build-otel globs recursively.
            hf_hub_download(repo, filename=f, repo_type="dataset",
                            revision=sha, local_dir=corpus)

        # Publish the resolved dir for build-otel (same cross-step marker
        # mechanism as /workspace/skip). build-otel must not rebuild this path.
        with open("/workspace/corpus_dir", "w") as fh:
            fh.write(corpus)
        print("download-corpus: %d %s file(s) ready in %s"
              % (len(files), ext, corpus))
        PYEOF

    # ---- step 2: parquet -> OTel JSONL (inline port of build_otel_corpus.py) ----
    # No branching filter — Exgentic has no branch structure; see
    # inference-sim/tektonc-data-collection#63. The python program is embedded as
    # a quoted heredoc so no shell interpolation touches it; MIN_ROUNDS/SPLIT are
    # passed via env from scalar params (no YAML read). The sh wrapper only
    # early-exits on the guard marker and installs the parquet dep.
    - name: build-otel
      image: python:3.11-slim
      script: |
        #!/bin/sh
        set -e
        [ -f /workspace/skip ] && { echo "skip"; exit 0; }
        # OTel-only step (#68). weka-jsonl feeds the downloaded JSONL straight to
        # `blis convert weka`, so the parquet -> OTel-JSONL hop does not apply.
        # Exiting before `pip install pyarrow` also keeps the weka path from
        # paying for a dependency it never uses.
        [ -f /workspace/skip_build_otel ] && {
          echo "build-otel: not an otel-parquet corpus — skipping"; exit 0; }
        # Pinned floor: the streaming read projects nested parquet LEAF columns
        # (spans.list.element.<...>), which is what keeps peak memory bounded on
        # a v2-sized shard. Unpinned, a pyarrow that rejects or ignores leaf
        # paths would either fail or silently regress memory ~50x.
        pip install --quiet 'pyarrow>=14'
        export MIN_ROUNDS="$(params.traceMinRounds)"
        export SPLIT="$(params.traceSplit)"
        export DEDUP_BY_CONVERSATION="$(params.traceDedupByConversation)"
        export SHUFFLE_SEED="$(params.traceShuffleSeed)"
        python3 - <<'PYEOF'
        import glob, hashlib, json, os, random, resource, sys
        import pyarrow.parquet as pq

        # The corpus dir is resolved by download-corpus (keyed <repo>@<sha>) and
        # handed over via this marker — do NOT rebuild the path here, or the two
        # steps can disagree about which dataset/revision is being converted.
        try:
            with open("/workspace/corpus_dir") as _fh:
                CORPUS = _fh.read().strip()
        except OSError as exc:
            sys.exit("build-otel: cannot read /workspace/corpus_dir (%s) — "
                     "download-corpus must run first" % exc)
        if not CORPUS:
            sys.exit("build-otel: /workspace/corpus_dir is empty")
        OUT_DIR = "/workspace/data/otel"
        OUT     = os.path.join(OUT_DIR, "corpus.jsonl")
        TEST_PCT = 30  # campaign convention (build_otel_corpus.py --test-pct default)
        # Batch size for the streaming read. Small because a single v2 row can
        # decode to ~1.5 MB; 32 keeps a batch well under 50 MB.
        BATCH_SIZE = int(os.environ.get("BATCH_SIZE") or 32)
        # Project the exact parquet LEAF columns this program reads. Projecting
        # the top-level "spans" column is NOT enough: the bulky payloads
        # (gen_ai.input.messages, gen_ai.output.messages, system_instructions,
        # tool.definitions, events) live INSIDE spans[].attributes, so selecting
        # "spans" drags every one of them in. Measured on the largest real
        # Exgentic v2 shard: 3069 MB peak with ["session_id", "spans"] vs 63 MB
        # with these leaves, for byte-identical output.
        # status.code is included even though the emitted status is hardcoded
        # below, so the projected span keeps the shape the rest of this program
        # documents. A leaf named here but absent from the file makes pyarrow
        # raise, which is the loud failure we want.
        LEAF_COLUMNS = [
            "session_id",
            "spans.list.element.span_id",
            "spans.list.element.name",
            "spans.list.element.start_time",
            "spans.list.element.status.code",
            "spans.list.element.attributes.gen_ai.request.model",
            "spans.list.element.attributes.gen_ai.usage.input_tokens",
            "spans.list.element.attributes.gen_ai.usage.output_tokens",
        ]
        # Payload keys that must NOT survive the projection. Checked once on the
        # first span seen: if a future pyarrow silently widens the selection back
        # to the whole struct, peak memory regresses ~50x, and that is invisible
        # in the output. Fail loudly instead.
        _PAYLOAD_KEYS = ("gen_ai.input.messages", "gen_ai.output.messages",
                         "gen_ai.system_instructions", "gen_ai.tool.definitions")
        _projection_checked = False

        min_rounds = int(os.environ.get("MIN_ROUNDS") or 2)
        split = (os.environ.get("SPLIT") or "test").lower()

        def usable_spans(spans):
            # Keep only spans with ground-truth token counts on both sides
            # (BA-2: output/input < 1 would panic the decode model at replay).
            out = []
            for s in spans:
                a = s.get("attributes") or {}
                it = a.get("gen_ai.usage.input_tokens", 0) or 0
                ot = a.get("gen_ai.usage.output_tokens", 0) or 0
                if it >= 1 and ot >= 1:
                    out.append(s)
            return out

        def in_split(sid):
            # Deterministic SHA1(session_id)%100 split (no RNG): test if < TEST_PCT.
            h = int(hashlib.sha1(sid.encode()).hexdigest(), 16) % 100
            if split == "all":
                return True
            if split == "train":
                return h >= TEST_PCT
            return h < TEST_PCT  # "test" (default)

        os.makedirs(OUT_DIR, exist_ok=True)
        # RECURSIVE: hf_hub_download preserves repo structure, so a
        # split-as-directory dataset lands at <CORPUS>/data/train/0000.parquet.
        # A non-recursive glob finds nothing there and the step would "succeed"
        # on an empty corpus. huggingface_hub keeps its own bookkeeping under
        # <CORPUS>/.cache, so exclude that rather than treat it as corpus data.
        files = sorted(
            f for f in glob.glob(os.path.join(CORPUS, "**", "*.parquet"),
                                 recursive=True)
            if "/.cache/" not in f
        )
        if not files:
            sys.exit("build-otel: no .parquet files under %s" % CORPUS)
        scanned = kept = dropped = 0
        # Collect selected sessions as (session_id, rec_spans). We do NOT write in
        # file order: the parquet is sorted by session_id, so a conversation's
        # sessions are contiguous and blis observe's first-N pool would draw from
        # only a few conversations. We dedup/shuffle below before writing.
        records = []
        for f in files:
            # Stream in batches with LEAF column projection (see LEAF_COLUMNS).
            # read_table().to_pylist() materialized an ENTIRE shard as Python
            # objects — fine at v1's ~71 MB/shard, fatal at v2's ~1.6 GB/shard.
            pf = pq.ParquetFile(f)
            for batch in pf.iter_batches(batch_size=BATCH_SIZE,
                                         columns=LEAF_COLUMNS):
              for r in batch.to_pylist():
                scanned += 1
                sid = r["session_id"]
                raw_spans = list(r["spans"] or [])
                if not _projection_checked and raw_spans:
                    _attrs = raw_spans[0].get("attributes") or {}
                    _leaked = [k for k in _PAYLOAD_KEYS if k in _attrs]
                    if _leaked:
                        sys.exit("build-otel: leaf projection did not take effect "
                                 "— %s still present in spans[].attributes; peak "
                                 "memory would regress ~50x. Check the pyarrow "
                                 "version and LEAF_COLUMNS." % ", ".join(_leaked))
                    _projection_checked = True
                spans = usable_spans(raw_spans)
                if len(spans) < min_rounds:
                    dropped += 1
                    continue
                kept += 1
                if not in_split(sid):
                    continue
                # Order each session's spans by start_time. (blis convert otel
                # re-sorts internally, so this is belt-and-suspenders.)
                spans = sorted(spans, key=lambda s: s["start_time"])
                rec_spans = []
                for s in spans:
                    a = s["attributes"]
                    rec_spans.append({
                        "span_id": s["span_id"],
                        "name": s.get("name", "chat"),
                        "start_time": s["start_time"],
                        "status": {"code": 1},
                        "attributes": {
                            "gen_ai.request.model": a.get("gen_ai.request.model", "model"),
                            "gen_ai.usage.input_tokens": int(a["gen_ai.usage.input_tokens"]),
                            "gen_ai.usage.output_tokens": int(a["gen_ai.usage.output_tokens"]),
                        },
                        "trace_id": sid,
                    })
                records.append((sid, rec_spans))
        selected = len(records)

        # Diversity selection (deterministic, so both arms/reruns get the same
        # corpus for a given seed):
        #   - dedup: keep one session per CONVERSATION (12-hex prefix of the
        #     session_id before '_') so we replay independent multi-turn sessions
        #     rather than many correlated sub-sessions of the same conversation.
        #   - shuffle: break the conversation-contiguous file order so blis
        #     observe's first-N pool spans many conversations.
        rng = random.Random(int(os.environ.get("SHUFFLE_SEED") or 42))
        dedup = (os.environ.get("DEDUP_BY_CONVERSATION") or "1").lower() not in ("0", "false", "no", "")
        conversations = len({sid.split("_")[0] for sid, _ in records})
        if dedup:
            by_base = {}
            for sid, rec in records:
                by_base.setdefault(sid.split("_")[0], []).append((sid, rec))
            deduped = []
            for base in sorted(by_base):                        # deterministic base order
                cands = sorted(by_base[base], key=lambda x: x[0])  # deterministic within base
                deduped.append(rng.choice(cands))               # seeded representative pick
            records = deduped
        rng.shuffle(records)                                    # seeded; breaks file order

        with open(OUT, "w") as fout:
            for sid, rec_spans in records:
                fout.write(json.dumps({"spans": rec_spans}) + "\n")
        print("build-otel: scanned=%d kept(>=%d usable)=%d dropped(<%d)=%d split=%s "
              "selected=%d conversations=%d dedup=%s written=%d shuffle_seed=%s"
              % (scanned, min_rounds, kept, min_rounds, dropped, split, selected,
                 conversations, dedup, len(records), os.environ.get("SHUFFLE_SEED") or 42))
        print("build-otel: wrote %s" % OUT)
        # Reported so #67's bounded-memory criterion can be CHECKED from the step
        # log; no resources.limits is imposed here, since guessing a limit would
        # OOMKill legitimate runs rather than reveal anything.
        # ru_maxrss units differ by platform: KIBIBYTES on Linux (where this step
        # runs) but BYTES on macOS. Normalize, so the number is also correct when
        # this program is run locally — e.g. by tests/test_prepare_trace_*.sh.
        _rss = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
        _rss_mb = _rss / 1048576.0 if sys.platform == "darwin" else _rss / 1024.0
        print("build-otel: peak_rss_mb=%.1f files=%d batch_size=%d"
              % (_rss_mb, len(files), BATCH_SIZE))
        if not records:
            sys.exit("build-otel: no sessions selected for split %r — nothing to convert" % split)
        PYEOF
        echo "OTel JSONL written to /workspace/data/otel/corpus.jsonl"

    # ---- step 3: corpus -> TraceV2 (blis convert otel | weka) ----
    # Dispatched on traceFormat (#68). Both subcommands write the same TraceV2
    # pair, so only the input discovery and the flag set differ:
    #   otel-parquet -> build-otel's fixed corpus.jsonl, `convert otel`
    #   weka-jsonl   -> the .jsonl inside the <repo>@<sha> corpus dir, `convert weka`
    #
    # The weka input is NOT a fixed path: it lives under the revision-keyed dir
    # #67 introduced, whose name is only knowable from the /workspace/corpus_dir
    # marker. So this step now consumes that marker rather than hardcoding a name.
    - name: convert
      image: debian:bookworm-slim
      script: |
        #!/bin/sh
        set -e
        [ -f /workspace/skip ] && { echo "skip"; exit 0; }
        BLIS="$(workspaces.source.path)/blis/blis"
        FORMAT="$(params.traceFormat)"
        : "${FORMAT:=otel-parquet}"
        CG="$(params.traceContextGrowth)"
        : "${CG:=accumulate}"
        MTT="$(params.traceMaxThinkTime)"
        OUT="/workspace/data/$(params.tracePath)"
        mkdir -p "$(dirname "${OUT}")"   # blis convert does not create the --trace-output parent dir

        # --max-think-time is passed ONLY when the descriptor set it. The two
        # converters default it in opposite directions (otel caps at 15s, weka
        # does not cap), so substituting any value here would silently change one
        # of the two paths. Empty => omit => each keeps its documented default.
        if [ -n "${MTT}" ]; then
          set -- --max-think-time "${MTT}"
        else
          set --
        fi

        case "${FORMAT}" in
          otel-parquet)
            # build-otel already applied MIN_ROUNDS while selecting sessions, so
            # --min-rounds is deliberately NOT passed here — adding it would
            # filter twice and change today's output.
            "${BLIS}" convert otel \
              --input /workspace/data/otel/corpus.jsonl \
              --context-growth "${CG}" \
              --trace-output "${OUT}" "$@"
            ;;
          weka-jsonl)
            [ -f /workspace/corpus_dir ] || {
              echo "ERROR: /workspace/corpus_dir missing — download-corpus did not run" >&2
              exit 1; }
            CORPUS="$(cat /workspace/corpus_dir)"
            [ -n "${CORPUS}" ] || { echo "ERROR: /workspace/corpus_dir is empty" >&2; exit 1; }
            # A bad marker path or an unmounted PVC gets its own message rather
            # than being reported as "no .jsonl found", which would blame the
            # dataset for a wiring fault.
            [ -d "${CORPUS}" ] || {
              echo "ERROR: corpus dir ${CORPUS} does not exist or is not a directory" >&2
              exit 1; }
            # find's status is captured DIRECTLY, not through a pipe: plain POSIX
            # sh has no pipefail, so `find ... | wc -l` yields tr's status (always
            # 0) and never find's. A -d check alone is not enough — find can fail
            # PARTWAY through (an unreadable subdirectory under the keyed corpus
            # dir) while still printing what it reached, so a partial listing that
            # happens to total exactly one file would otherwise sail into the
            # converter with no indication anything went wrong.
            FOUND="$(find "${CORPUS}" -name '*.jsonl' -type f)" || {
              echo "ERROR: find failed while scanning ${CORPUS} for .jsonl files" >&2
              exit 1; }
            # Discover the JSONL rather than assume a name; the file sits at
            # whatever path the dataset uses inside the keyed corpus dir.
            # grep -c . counts non-empty lines, so an empty FOUND counts 0 rather
            # than the 1 that `printf | wc -l` would report.
            COUNT="$(printf '%s\n' "${FOUND}" | grep -c . || true)"
            if [ "${COUNT}" -eq 0 ]; then
              echo "ERROR: no .jsonl found under ${CORPUS}" >&2
              exit 1
            elif [ "${COUNT}" -gt 1 ]; then
              # Refuse rather than pick one: `blis convert weka` takes a single
              # JSONL (its directory mode is *.json, not *.jsonl), so any choice
              # here would silently convert a subset of the corpus.
              echo "ERROR: ${COUNT} .jsonl files under ${CORPUS}; expected exactly one" >&2
              printf '%s\n' "${FOUND}" >&2
              exit 1
            fi
            # COUNT is exactly 1 here, so FOUND is a single line. Reused rather
            # than re-running find, which would be two more unguarded calls.
            INPUT="${FOUND}"
            # build-otel is skipped on this path, so it is not enforcing
            # min_rounds — thread it to the converter or the descriptor field
            # goes inert for weka while still being part of the cache key.
            MR="$(params.traceMinRounds)"
            : "${MR:=2}"
            "${BLIS}" convert weka \
              --input "${INPUT}" \
              --context-growth "${CG}" \
              --min-rounds "${MR}" \
              --trace-output "${OUT}" "$@"
            ;;
          *)
            echo "ERROR: unknown traceFormat '${FORMAT}'" >&2
            exit 1
            ;;
        esac
        if [ ! -f "${OUT}.yaml" ] || [ ! -f "${OUT}.csv" ]; then
          echo "ERROR: expected ${OUT}.yaml and ${OUT}.csv after conversion" >&2
          exit 1
        fi
        echo "TraceV2 written: ${OUT}.{yaml,csv} (format=${FORMAT})"
        ls -la "${OUT}.yaml" "${OUT}.csv"
