apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-model-files
spec:
  description: |
    Remove downloaded model files from the model-cache PVC to free disk space.

  workspaces:
    - name: model-cache
      mountPath: /cache

  params:
    - name: model
      type: string
      description: HuggingFace model ID (e.g. meta-llama/Llama-3.1-8B-Instruct)

  steps:
    - name: cleanup
      image: alpine/kubectl:1.34.1
      env:
        - name: MODEL_PATH
          value: "models/$(params.model)"
        - name: MOUNT_PATH
          value: /cache
      script: |
        #!/bin/sh
        set -eu

        TARGET="${MOUNT_PATH}/${MODEL_PATH}"
        if [ -d "${TARGET}" ]; then
          SIZE=$(du -sh "${TARGET}" 2>/dev/null | cut -f1)
          echo "Removing ${TARGET} (${SIZE})"
          rm -rf "${TARGET}"
          echo "Done"
        else
          echo "Nothing to clean up at ${TARGET}"
        fi

        echo "Remaining PVC usage:"
        df -h "${MOUNT_PATH}"
