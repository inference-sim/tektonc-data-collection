# tektonc-data-collection/tekton/tasks/run-workload-blis-observe-binary.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-workload-blis-observe-binary
spec:
  description: >-
    Run blis observe against a live inference endpoint using the PVC-installed
    blis binary (built by install-blis). Writes TraceV2 output
    (trace_header.yaml + trace_data.csv) to the data PVC.

    The observe command line arrives pre-rendered in observeArgs; this task
    appends --server-url and runs it. It does not know the workload kind —
    corpus-mode replay and generative spec-mode differ only in which flags the
    renderer emitted, so adding a traffic kind needs no change here.

  params:
    - name: endpoint
      type: string
      description: >-
        Inference endpoint URL. Appended to the observe command as --server-url
        by this task: it is a runtime task result (the standup task's endpoint
        result), so the renderer that produces observeArgs cannot know it.
    - name: observeArgs
      type: string
      description: >-
        Pre-rendered `blis observe` argv — every flag except --server-url.
        Produced by sim2real's assemble (pipeline/lib/tekton.py, see
        inference-sim/sim2real#900), so the effective command is readable from
        the generated PipelineRun without opening this file or blis's source.

        No default, deliberately: a Pipeline not yet updated to pass it fails at
        PipelineRun creation with a Tekton param error, instead of reaching blis
        with no workload source and failing deeper.

        Two paths below are owned by this task and are part of the contract —
        the renderer must match them:
          * the `data` workspace mounts at /workspace/data, so every
            data-PVC-relative path carries that prefix: the TraceV2 outputs
            (--trace-header, --trace-data, --saturation-report) under
            /workspace/data/<resultsDir>/, and the corpus pair
            (--corpus-header, --corpus-data).
          * write-workload-spec writes the spec to /workspace/workload.yaml, so
            a generative cell renders --workload-spec /workspace/workload.yaml.

        The value is word-split on IFS, so no single flag value may contain a
        space and the string must contain no shell metacharacters (quote, $,
        backtick, ;, |, &). Corpus-mode and spec-mode flags are mutually
        exclusive; the renderer enforces that — this task does not check it.
    - name: workloadSpec
      type: string
      description: >-
        Inline YAML content of the workload spec file — file content, not a
        flag. write-workload-spec writes it to /workspace/workload.yaml. Empty
        for corpus-mode cells, where the file is written empty and never read.
    - name: resultsDir
      type: string
      description: >-
        Path under /workspace/data for this cell's output. Used here for the
        chmod and the epp_log_since marker in write-workload-spec, and for the
        trailing listing in run-observe. It no longer builds any part of the
        observe command — the renderer embeds the same path in observeArgs'
        output flags.

  workspaces:
    - name: data
      description: "Shared PVC for storing TraceV2 results (data-pvc)"
    - name: source
      description: "Shared PVC containing the blis binary (source-pvc)"

  steps:
    - name: write-workload-spec
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -e
        # RESULTS_DIR is created by an upstream pipeline step; we use it
        # as-is. chmod 777 lets subsequent steps that run as a different
        # uid write into it.
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        chmod 777 "${RESULTS_DIR}"
        date -u +"%Y-%m-%dT%H:%M:%SZ" > "${RESULTS_DIR}/epp_log_since"
        cat > /tmp/spec_raw.txt << '__WORKLOAD_SPEC_END__'
        $(params.workloadSpec)
        __WORKLOAD_SPEC_END__
        sed 's/\\n/\n/g' /tmp/spec_raw.txt > /workspace/workload.yaml
        echo "Workload spec written to /workspace/workload.yaml"
        head -5 /workspace/workload.yaml

    - name: run-observe
      image: debian:bookworm-slim
      script: |
        #!/bin/sh
        set -e
        BLIS="$(workspaces.source.path)/blis/blis"
        # observeArgs carries the whole command line. No branch on workload kind:
        # corpus-mode vs spec-mode is already decided by which flags the renderer
        # emitted, and their mutual exclusion is enforced there rather than by a
        # shell conditional here.
        OBSERVE_ARGS="$(params.observeArgs)"
        echo "run-observe: observe ${OBSERVE_ARGS} --server-url $(params.endpoint)"
        # shellcheck disable=SC2086
        # OBSERVE_ARGS is a pre-rendered argv; splitting it into separate
        # arguments is the intended behavior, so it must stay unquoted.
        "${BLIS}" observe ${OBSERVE_ARGS} --server-url $(params.endpoint)
        echo "blis observe complete. Output in /workspace/data/$(params.resultsDir)"
        ls /workspace/data/$(params.resultsDir)
