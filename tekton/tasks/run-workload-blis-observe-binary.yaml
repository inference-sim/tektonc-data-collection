# tektonc-data-collection/tekton/tasks/run-workload-blis-observe-binary.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-workload-blis-observe-binary
spec:
  description: >-
    Run blis observe against a live inference endpoint using the PVC-installed
    blis binary (built by install-blis). Writes TraceV2 output
    (trace_header.yaml + trace_data.csv) to the data PVC.

  params:
    - name: endpoint
      type: string
      description: "Inference endpoint URL"
    - name: model
      type: string
      description: "Model name for API requests"
    - name: workloadSpec
      type: string
      description: "Inline YAML content of the workload spec file"
    - name: resultsDir
      type: string
      description: "Path under /workspace/data to write TraceV2 output"
    - name: maxConcurrency
      type: string
      default: "10000"
      description: "Maximum concurrent requests blis will drive"
    - name: timeout
      type: string
      default: "1800"
      description: "Workload run timeout in seconds"
    - name: warmupRequests
      type: string
      default: "50"
      description: "Number of warmup requests before measurement begins"
    - name: prewarmDuration
      type: string
      default: "60s"
      description: "Duration of system priming phase before real workload (e.g., 60s). 0s disables."
    - name: extraArgs
      type: string
      default: ""
      description: "Additional CLI flags appended to the blis observe command (one-off experimentation)"
    - name: tracePath
      type: string
      default: ""
      description: >-
        Trace-input mode: relative path under /workspace/data to a recorded TraceV2
        (prepare-trace writes <tracePath>.yaml + <tracePath>.csv). When non-empty,
        observe replays the trace closed-loop instead of using workloadSpec.
    - name: concurrentSessions
      type: string
      default: ""
      description: "Trace-input mode: number of concurrent sessions in the fixed pool (blis observe --concurrent-sessions)"
    - name: totalSessions
      type: string
      default: ""
      description: "Trace-input mode: total sessions to replay, corpus duplicated to fill (blis observe --total-sessions)"

  workspaces:
    - name: data
      description: "Shared PVC for storing TraceV2 results (data-pvc)"
    - name: source
      description: "Shared PVC containing the blis binary (source-pvc)"

  steps:
    - name: write-workload-spec
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -e
        # RESULTS_DIR is created by an upstream pipeline step; we use it
        # as-is. chmod 777 lets subsequent steps that run as a different
        # uid write into it.
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        chmod 777 "${RESULTS_DIR}"
        date -u +"%Y-%m-%dT%H:%M:%SZ" > "${RESULTS_DIR}/epp_log_since"
        cat > /tmp/spec_raw.txt << '__WORKLOAD_SPEC_END__'
        $(params.workloadSpec)
        __WORKLOAD_SPEC_END__
        sed 's/\\n/\n/g' /tmp/spec_raw.txt > /workspace/workload.yaml
        echo "Workload spec written to /workspace/workload.yaml"
        head -5 /workspace/workload.yaml

    - name: run-observe
      image: debian:bookworm-slim
      script: |
        #!/bin/sh
        set -e
        BLIS="$(workspaces.source.path)/blis/blis"
        # Workload source: trace-input (closed-loop replay of a recorded TraceV2)
        # when tracePath is set, else the synthesized workload spec. These are
        # mutually exclusive; sourcing flags never come through extraArgs.
        TRACE_PATH="$(params.tracePath)"
        if [ -n "${TRACE_PATH}" ]; then
          WL_ARGS="--input-trace-header /workspace/data/${TRACE_PATH}.yaml \
            --input-trace-data /workspace/data/${TRACE_PATH}.csv \
            --concurrent-sessions $(params.concurrentSessions) \
            --total-sessions $(params.totalSessions)"
          echo "run-observe: trace-input mode (tracePath=${TRACE_PATH})"
        else
          WL_ARGS="--workload-spec /workspace/workload.yaml"
          echo "run-observe: generative workload-spec mode"
        fi
        # shellcheck disable=SC2086
        "${BLIS}" observe \
          --max-concurrency $(params.maxConcurrency) \
          --timeout $(params.timeout) \
          --prewarm-duration $(params.prewarmDuration) \
          --warmup-requests $(params.warmupRequests) \
          --post-hoc-detector composite \
          --server-url $(params.endpoint) \
          --model $(params.model) \
          ${WL_ARGS} \
          --trace-header /workspace/data/$(params.resultsDir)/trace_header.yaml \
          --trace-data /workspace/data/$(params.resultsDir)/trace_data.csv \
          --saturation-report /workspace/data/$(params.resultsDir)/saturation.json \
          $(params.extraArgs)
        echo "blis observe complete. Output in /workspace/data/$(params.resultsDir)"
        ls /workspace/data/$(params.resultsDir)
