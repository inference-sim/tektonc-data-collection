apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-gaie
spec:
  description: |
    Configurte Kubernetes Gateway API Inference Extension for a model stack.

  results:
    - name: inferencepool
      description: InferencePool name
    - name: epp-container
      description: Name of the EPP container in the EPP deployment (the one with command args)

  params:
    - { name: modelLabel, type: string }
    - { name: config, type: string }
    - { name: overrides, type: string, default: "" }
    - { name: namespace, type: string }

  steps:

    - name: augment-overrides
      results:
        - { name: merged-overrides }
      image: alpine:3.20
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set -eu

        printf "%s" "$(params.overrides)" > $(step.results.merged-overrides.path)
        echo "inferencePool.modelServers.matchLabels.\"llm-d.ai/model\"=$(params.modelLabel)" >> $(step.results.merged-overrides.path)

    - name: apply-overrides
      ref:
        name: apply-overrides
      params:
        - name: inputYaml
          value: "$(params.config)"
        - name: overrides
          value: "$(steps.augment-overrides.results.merged-overrides)"

    - name: install-gaie
      ref: 
        name: helm-upgrade-install
      params:
        - name: releaseName
          value: $(params.modelLabel)-gaie

        - name: chart
          value: oci://registry.k8s.io/gateway-api-inference-extension/charts/inferencepool
        - name: version
          value: v1.4.0

        - name: namespace
          value: $(params.namespace)
        - name: valuesYamlUrl
          value: "/workspace/output.yaml"

        - name: wait
          value: "false"
        - name: timeout
          value: 15m

    - name: fix-rbac
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set -eu

        RELEASE="$(params.modelLabel)-gaie"
        NAMESPACE="$(params.namespace)"
        EPP_NAME="$(echo -n "${RELEASE}" | cut -c1-40)-epp"
        SA_NAME="${EPP_NAME}"

        echo "Creating supplemental RBAC for EPP v1alpha2 resources"
        cat <<EOF | kubectl apply -f -
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: ${RELEASE}-epp-v1alpha2
          labels:
            app.kubernetes.io/managed-by: tekton
        rules:
        - apiGroups: ["inference.networking.x-k8s.io"]
          resources: ["inferencemodelrewrites", "inferenceobjectives"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["inference.networking.x-k8s.io"]
          resources: ["inferencemodelrewrites/status", "inferenceobjectives/status"]
          verbs: ["get"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: ${RELEASE}-epp-v1alpha2
          labels:
            app.kubernetes.io/managed-by: tekton
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: ${RELEASE}-epp-v1alpha2
        subjects:
        - kind: ServiceAccount
          name: ${SA_NAME}
          namespace: ${NAMESPACE}
        EOF
        echo "Supplemental RBAC created for ${SA_NAME}"

    - name: fix-epp-flags
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set -eu

        # Workaround: upstream inferencepool chart v1.4.0 renders flags as
        # separate args ("--v", "5") instead of "--v=5". The Go pflag/klog
        # parser requires the --key=value format for the -v verbosity flag.
        # This step patches the EPP deployment to merge split flag pairs.

        apk add --no-cache -q jq

        RELEASE="$(params.modelLabel)-gaie"
        NAMESPACE="$(params.namespace)"
        DEPLOY="$(echo -n "${RELEASE}" | cut -c1-40)-epp"

        echo "Identifying EPP container in deployment ${DEPLOY}..."

        # Find the EPP container: the main executable container has command args;
        # sidecar containers (e.g. tokenizer-uds) have no args.
        DEPLOY_JSON=$(kubectl get deploy "${DEPLOY}" -n "${NAMESPACE}" -o json)
        EPP_CTR=$(echo "${DEPLOY_JSON}" | jq -r '
          .spec.template.spec.containers[]
          | select(.args != null and (.args | length) > 0)
          | .name
        ' | head -1)

        if [ -z "${EPP_CTR}" ]; then
          echo "WARNING: No container with args found; falling back to first container"
          EPP_CTR=$(echo "${DEPLOY_JSON}" | jq -r '.spec.template.spec.containers[0].name')
        fi

        echo "EPP container: ${EPP_CTR}"
        printf "%s" "${EPP_CTR}" > "$(results.epp-container.path)"

        echo "Checking EPP deployment ${DEPLOY} for split flag args..."

        # Get current args for the EPP container
        ORIGINAL=$(echo "${DEPLOY_JSON}" | jq -c --arg ctr "${EPP_CTR}" \
          '.spec.template.spec.containers[] | select(.name==$ctr) | .args // empty')

        if [ -z "${ORIGINAL}" ]; then
          echo "No args found on EPP container ${EPP_CTR}, skipping flag fix"
          exit 0
        fi

        # Merge adjacent "--key" "value" pairs into "--key=value"
        PATCHED=$(echo "${ORIGINAL}" | jq -c '
          . as $arr | reduce range(length) as $i (
            {out: [], skip: false};
            if .skip then .skip = false
            elif ($arr[$i] | test("^--")) and ($arr[$i] | contains("=") | not)
                 and ($i + 1 < ($arr | length)) and ($arr[$i + 1] | test("^-") | not)
            then .out += ["\($arr[$i])=\($arr[$i + 1])"] | .skip = true
            else .out += [$arr[$i]]
            end
          ) | .out
        ') || { echo "Warning: jq flag-merge failed, skipping patch"; exit 0; }

        if [ "${ORIGINAL}" = "${PATCHED}" ]; then
          echo "Args already in --key=value format, no patch needed"
        else
          echo "Patching args: ${ORIGINAL} -> ${PATCHED}"
          CTR_INDEX=$(echo "${DEPLOY_JSON}" | jq --arg ctr "${EPP_CTR}" \
            '[.spec.template.spec.containers | to_entries[] | select(.value.name==$ctr) | .key][0]')
          kubectl patch deploy "${DEPLOY}" -n "${NAMESPACE}" --type=json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/${CTR_INDEX}/args\",\"value\":${PATCHED}}]"
          echo "EPP deployment patched, waiting for rollout..."
          kubectl rollout status deploy "${DEPLOY}" -n "${NAMESPACE}" --timeout=120s
        fi

    - name: wait-for-epp
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set -eu

        RELEASE="$(params.modelLabel)-gaie"
        NAMESPACE="$(params.namespace)"
        DEPLOY="$(echo -n "${RELEASE}" | cut -c1-40)-epp"

        echo "Waiting for EPP deployment ${DEPLOY} to become available..."
        kubectl rollout status deploy "${DEPLOY}" -n "${NAMESPACE}" --timeout=300s
        echo "EPP deployment is ready"

    - name: record-results
      image: alpine:3.20
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set -eu

        echo "record-results called"

        # InferencePool name is the helm release name
        RELEASE="$(params.modelLabel)-gaie"
        printf "%s" "${RELEASE}" > $(results.inferencepool.path)

        echo "record-results completed"