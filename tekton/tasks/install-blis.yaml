apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: install-blis
spec:
  description: |
    Build BLIS binary from GitHub (inference-sim main branch).
    Outputs the blis executable to workspace for use in observe/replay/calibrate tasks.

  workspaces:
    - name: data
      description: Shared workspace where blis binary will be stored

  steps:
    - name: build-blis
      image: golang:1.25.5-bookworm
      script: |
        #!/bin/sh
        set -eu
        echo "🔄 Building BLIS binary from inference-sim repository"

        echo "Installing required tools (git)..."
        apt-get update
        apt-get install -y git && apt-get clean && rm -rf /var/cache/apt

        echo "Cloning inference-sim main branch..."
        # Add timeout and depth limit for faster clone
        if ! timeout 5m git clone --depth 1 https://github.com/inference-sim/inference-sim.git; then
          echo "❌ ERROR: Git clone timed out after 5 minutes"
          echo "This usually indicates network connectivity issues."
          echo "Checking basic connectivity..."
          timeout 10s curl -I https://github.com 2>&1 || echo "Cannot reach GitHub"
          exit 1
        fi
        cd inference-sim

        echo "Building BLIS binary..."
        go build -o /workspace/data/blis main.go

        echo "Copying runtime dependencies for BLIS..."
        cp hardware_config.json /workspace/data/hardware_config.json
        cp defaults.yaml /workspace/data/defaults.yaml
        cp -r model_configs /workspace/data/model_configs

        echo "Verifying installation..."
        ls -lh /workspace/data/blis /workspace/data/hardware_config.json /workspace/data/defaults.yaml
        ls -d /workspace/data/model_configs
        /workspace/data/blis --version || echo "Note: --version flag may not be implemented"

        echo "✅ BLIS binary and runtime dependencies installed successfully"
