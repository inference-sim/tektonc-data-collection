apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: llmdbenchmark-standup
spec:
  description: |
    Stand up a complete llm-d stack using llmdbenchmark standup. Activates the
    venv installed by install-llmdbenchmark, runs standup, then discovers the
    gateway endpoint via llmdbenchmark run --list-endpoints and emits it as a
    task result.

    Expects two prerequisite tasks to have run:
      - install-llmdbenchmark: creates the Python venv
      - (implicit) workspace setup: llm-d-benchmark source is on the workspace

    The spec_content param is a Jinja2 spec template (.yaml.j2) with absolute
    paths for values_file, template_dir, and scenario_file already embedded by
    prepare.py. No --base-dir flag is needed.

  params:
    - name: spec_content
      type: string
      description: >-
        Content of the llm-d-benchmark spec Jinja2 template (.yaml.j2).
        Must embed absolute paths for values_file, template_dir, and
        scenario_file. If scenario_content is provided, scenario_file must
        point at /tmp/llmdbench-config/scenario.yaml.
    - name: scenario_content
      type: string
      default: ""
      description: >-
        Content of the scenario YAML override file. When non-empty, written to
        /tmp/llmdbench-config/scenario.yaml, which must match the scenario_file
        path embedded in spec_content.
    - name: namespace
      type: string
      description: Kubernetes namespace
    - name: non_admin
      type: string
      default: "true"
      description: Pass --non-admin to skip cluster-admin operations
    - name: skip_smoketest
      type: string
      default: "true"
      description: Skip the inline post-standup smoketest (smoketest runs as a separate step after a delay)
    - name: smoketest_delay
      type: string
      default: "60"
      description: Seconds to wait after standup before running the separate smoketest step
    - name: extra_args
      type: string
      default: ""
      description: Additional flags passed verbatim to standup
    - name: plans_dir
      type: string
      default: ""
      description: >-
        Relative path on the data workspace for persisting rendered plans.
        When set, plans are copied to data/<plans_dir>/ after standup.

  volumes:
    - name: config-scratch
      emptyDir: {}

  workspaces:
    - name: source
    - name: data
      optional: true

  results:
    - name: endpoint
      description: Gateway endpoint URL extracted via llmdbenchmark run --list-endpoints

  steps:

    - name: write-config
      image: python:3.12-slim
      volumeMounts:
        - name: config-scratch
          mountPath: /tmp/llmdbench-config
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
      script: |
        #!/bin/bash
        set -eux

        export GITHUB_TOKEN="${GITHUB_TOKEN}"

        # Write Tekton params to files via QUOTED heredocs.
        # Param substitution is verbatim text-replace, so embedded shell
        # metacharacters (single quotes, `@`, `$`, backticks, `%`) survived
        # untouched here — vs. interpolation into a single-quoted bash arg,
        # where embedded `'` would close the outer quoting and corrupt the
        # value (e.g. YAML keys like '@type' lose their quoting and break
        # downstream yaml.safe_load).
        cat <<'__TEKTON_PARAM_EOF__' > /tmp/llmdbench-config/spec.yaml.j2
        $(params.spec_content)
        __TEKTON_PARAM_EOF__

        cat <<'__TEKTON_PARAM_EOF__' > /tmp/llmdbench-config/scenario_in.yaml
        $(params.scenario_content)
        __TEKTON_PARAM_EOF__

        if [ -s /tmp/llmdbench-config/scenario_in.yaml ]; then
          PLANS_DIR="$(params.plans_dir)"
          if [ -n "${PLANS_DIR}" ] && [ -d "$(workspaces.data.path)" ]; then
            export WORK_DIR="$(workspaces.data.path)/${PLANS_DIR}"
            mkdir -p "${WORK_DIR}"
            pip install pyyaml -q
            python3 <<'__TEKTON_PY_EOF__'
        import os, yaml
        with open('/tmp/llmdbench-config/scenario_in.yaml') as f:
            s = yaml.safe_load(f)
        sc = s.get('scenario', [])
        if sc:
            sc[0]['workDir'] = os.environ['WORK_DIR']
        with open('/tmp/llmdbench-config/scenario.yaml', 'w') as f:
            yaml.dump(s, f, default_flow_style=False)
        __TEKTON_PY_EOF__
          else
            cp /tmp/llmdbench-config/scenario_in.yaml /tmp/llmdbench-config/scenario.yaml
          fi
        fi

    - name: install-and-standup
      image: python:3.12-slim
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: config-scratch
          mountPath: /tmp/llmdbench-config
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
      script: |
        #!/bin/bash
        set -eux

        # python:3.12-slim runs as root; sudo is absent but required by install.sh
        apt-get update -y -qq
        apt-get install -y sudo
        export LLMDBENCH_VENV_DIR="$(workspaces.source.path)/llm-d-benchmark/.venv"
        (cd "$(workspaces.source.path)/llm-d-benchmark" && bash install.sh --no-uv)

        VENV_PATH="$(workspaces.source.path)/llm-d-benchmark/.venv"
        SPEC_FILE="/tmp/llmdbench-config/spec.yaml.j2"

        echo "🐍 Activating venv at ${VENV_PATH}"
        if [ ! -f "${VENV_PATH}/bin/activate" ]; then
          echo "❌ venv not found at ${VENV_PATH} — run install-llmdbenchmark first"
          exit 1
        fi
        source "${VENV_PATH}/bin/activate"

        echo "🔍 Verifying llmdbenchmark installation"
        llmdbenchmark --version

        echo "📄 specContent references:"
        python3 -c "import yaml;from pathlib import Path;spec=yaml.safe_load(open('${SPEC_FILE}').read());[print(f'  {k}: {spec.get(k,{}).get(\"path\",\"\")} [{\"OK\" if Path(spec.get(k,{}).get(\"path\",\"\")).exists() else \"MISSING\"}]') for k in ('values_file','template_dir','scenario_file')];sp=spec.get('scenario_file',{}).get('path','');Path(sp).exists() and (print('  --- scenario content ---'),print(open(sp).read()[:2000]),print('  --- end scenario ---'))"

        echo "🚀 Running llmdbenchmark standup"
        GLOBAL_ARGS="--spec ${SPEC_FILE}"
        if [ "$(params.non_admin)" = "true" ]; then
          GLOBAL_ARGS="${GLOBAL_ARGS} --non-admin"
        fi

        STANDUP_ARGS="-p $(params.namespace)"
        if [ "$(params.skip_smoketest)" = "true" ]; then
          STANDUP_ARGS="${STANDUP_ARGS} --skip-smoketest"
        fi
        if [ -n "$(params.extra_args)" ]; then
          STANDUP_ARGS="${STANDUP_ARGS} $(params.extra_args)"
        fi

        # shellcheck disable=SC2086
        llmdbenchmark --verbose ${GLOBAL_ARGS} standup ${STANDUP_ARGS}

        echo "🔎 Discovering gateway endpoint"
        ENDPOINT=$(llmdbenchmark --spec "${SPEC_FILE}" run \
          --list-endpoints -p "$(params.namespace)" 2>&1 \
          | sed -n 's/.*--endpoint-url \(http[^ \\]*\).*/\1/p' | head -1)

        if [ -z "${ENDPOINT}" ]; then
          echo "❌ Failed to discover endpoint via llmdbenchmark run --list-endpoints"
          exit 1
        fi

        echo "✅ Endpoint discovered: ${ENDPOINT}"
        printf "%s" "${ENDPOINT}" > "$(results.endpoint.path)"

        # Persist CLI tools to the workspace so later steps/tasks can reuse them
        TOOL_BIN="$(workspaces.source.path)/llm-d-benchmark/.tools/bin"
        mkdir -p "${TOOL_BIN}"
        for tool in kubectl helmfile helm kustomize yq jq crane skopeo; do
          if [ -f "/usr/local/bin/${tool}" ]; then
            cp "/usr/local/bin/${tool}" "${TOOL_BIN}/"
          fi
        done
        echo "🔧 Persisted CLI tools to ${TOOL_BIN}"

    - name: smoketest-delay
      image: python:3.12-slim
      script: |
        #!/bin/bash
        if [ "$(params.skip_smoketest)" != "true" ]; then
          echo "⏩ Inline smoketest enabled — skipping separate smoketest steps"
          exit 0
        fi
        DELAY="$(params.smoketest_delay)"
        if [ "${DELAY}" -gt 0 ] 2>/dev/null; then
          echo "⏳ Waiting ${DELAY}s for gateway/routing to converge before smoketest..."
          sleep "${DELAY}"
          echo "✅ Delay complete"
        else
          echo "⏩ No smoketest delay configured"
        fi

    - name: smoketest
      image: python:3.12-slim
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: config-scratch
          mountPath: /tmp/llmdbench-config
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
      script: |
        #!/bin/bash
        set -eux

        if [ "$(params.skip_smoketest)" != "true" ]; then
          echo "⏩ Inline smoketest enabled — skipping separate smoketest step"
          exit 0
        fi

        VENV_PATH="$(workspaces.source.path)/llm-d-benchmark/.venv"
        SPEC_FILE="/tmp/llmdbench-config/spec.yaml.j2"
        TOOL_BIN="$(workspaces.source.path)/llm-d-benchmark/.tools/bin"

        export PATH="${TOOL_BIN}:${PATH}"
        source "${VENV_PATH}/bin/activate"

        GLOBAL_ARGS="--spec ${SPEC_FILE}"
        if [ "$(params.non_admin)" = "true" ]; then
          GLOBAL_ARGS="${GLOBAL_ARGS} --non-admin"
        fi

        echo "🔍 Running smoketest"
        # shellcheck disable=SC2086
        llmdbenchmark --verbose ${GLOBAL_ARGS} smoketest -p "$(params.namespace)"
        echo "✅ Smoketest passed"
