apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: download-model
spec:
  description: |
    Deploy Kubernetes Gateway API Inference Extension.

  workspaces:
    - name: model-cache
      mountPath: /cache
    - name: hf-credentials
      readOnly: true

  params:
    - name: model
      type: string

  steps:
    - name: download-model
      image: python:3.10
      env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp/huggingface
        - name: MOUNT_PATH
          value: /cache # mount path of workspace model-cache
        - name: HF_MODEL_ID
          value: "$(params.model)"
        - name: MODEL_PATH
          value: "models/$(params.model)"
      script: |
        #!/bin/sh
        set -eu

        export HF_TOKEN=$(cat "$(workspaces.hf-credentials.path)/HF_TOKEN")
        export PATH="${PATH}:${HOME}/.local/bin"

        # Check if model already exists on PVC (config.json = complete download)
        if [ -f "${MOUNT_PATH}/${MODEL_PATH}/config.json" ]; then
          echo "Model already exists at ${MOUNT_PATH}/${MODEL_PATH}, skipping download"
          ls -la "${MOUNT_PATH}/${MODEL_PATH}" | head -20
          exit 0
        fi

        # Clean up partial downloads (metadata without weights)
        if [ -d "${MOUNT_PATH}/${MODEL_PATH}" ]; then
          echo "Partial download detected, cleaning up ${MOUNT_PATH}/${MODEL_PATH}"
          rm -rf "${MOUNT_PATH}/${MODEL_PATH}"
        fi

        echo "Model not found, downloading ${HF_MODEL_ID}..."
        mkdir -p "${MOUNT_PATH}/${MODEL_PATH}"
        pip install huggingface_hub
        python -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['HF_MODEL_ID'], local_dir=os.path.join('/cache', os.environ['MODEL_PATH'])); print('Download complete')"
