apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-gateway
spec:
  description: |
    Deploy a gateway.

  params:
    - { name: config, type: string }
    - { name: experimentId, type: string }
    - { name: namespace, type: string }
    - { name: port, type: string, default: 80 }
    - { name: startupTimeout, type: string, default: "600" }

  results:
    - name: gateway
      description: name of gateway
    - name: endpoint
      description: endpoint of gateway (svc.namespace:port)

  steps:
    - name: install-gateway
      ref: 
        name: helm-upgrade-install
      params:
        - name: releaseName
          value: gw-$(params.experimentId)
        - name: chart
          value: llm-d-infra/llm-d-infra
        - name: repoName
          value: llm-d-infra
        - name: repoUrl
          value: https://llm-d-incubation.github.io/llm-d-infra/
        
        - name: namespace
          value: $(params.namespace)
        - name: timeout
          value: 15m
        - name: valuesYaml
          value: "$(params.config)"

    - name: wait-for-gateway-service
      env:
        - { name: NAMESPACE, value: $(params.namespace) }
        - { name: TIMEOUT, value: $(params.startupTimeout) }
      image: dtzar/helm-kubectl:3.19
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set -eu
        RELEASE="gw-$(params.experimentId)"
        GW_NAME="${RELEASE}-inference-gateway"
        SVC_NAME="${GW_NAME}-istio"

        echo "Waiting up to ${TIMEOUT}s for Service ${SVC_NAME} in ${NAMESPACE}..."
        ELAPSED=0
        until kubectl get service "${SVC_NAME}" -n "${NAMESPACE}" >/dev/null 2>&1; do
          if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
            echo "Timed out waiting for Service ${SVC_NAME}"
            exit 1
          fi
          sleep 5
          ELAPSED=$((ELAPSED + 5))
        done
        echo "Service ${SVC_NAME} is available."

    - name: record-results
      env:
        - { name: NAMESPACE, value: $(params.namespace) }
        - { name: PORT, value: $(params.port) }
      image: alpine:3.20
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set -eu

        # For istio gateway class, service name has -istio suffix
        RELEASE="gw-$(params.experimentId)"
        printf "%s" "${RELEASE}-inference-gateway" > $(results.gateway.path)
        printf "%s" "${RELEASE}-inference-gateway-istio.${NAMESPACE}:${PORT}" > $(results.endpoint.path)