# tektonc-data-collection/tekton/tasks/stream-gpu-stats.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: stream-gpu-stats
spec:
  description: >-
    Samples per-GPU state (memory, utilization, processes) on every node
    that hosts a vLLM pod, by exec-ing into the per-node DCGM exporter
    pod once per intervalSeconds. Output lands in resultsDir/gpu_logs/
    on data-pvc, one log file per node.

    Also captures a one-shot pod -> GPU-UUID snapshot at startup
    (Phase 1.5) by exec-ing `nvidia-smi -L` inside each vLLM container.
    This gives downstream analysis a direct pod -> UUID join that is
    not available from `kubectl get pod -o yaml` (the device-plugin
    assignment is invisible to the API server).

    Runs in parallel with run-workload; exits when collect-results
    writes resultsDir/gpu_stream_done. Non-fatal: failures do not fail
    the pipeline.

    Pod discovery uses the llm-d-modelservice chart labels
    (llm-d.ai/role=decode and llm-d.ai/role=prefill) — same convention
    as collect-results, so the streamer and the collector see the same
    pod set.

  workspaces:
    - name: data
      description: "Shared PVC (data-pvc)"

  params:
    - { name: namespace,        type: string }
    - { name: resultsDir,       type: string }
    - { name: intervalSeconds,  type: string, default: "10" }
    - name: dcgmNamespace
      type: string
      default: ""
      description: >-
        Namespace where the DCGM exporter DaemonSet runs (commonly
        nvidia-gpu-operator, gpu-operator, or nvidia). Empty = search
        across all namespaces on first resolve, then cache the
        discovered namespace for the rest of the run.
    - { name: dcgmSelector,  type: string, default: "app.kubernetes.io/name=nvidia-dcgm-exporter" }
    - { name: dcgmContainer, type: string, default: "nvidia-dcgm-exporter" }
    - { name: vllmContainer, type: string, default: "vllm" }

  steps:
    - name: stream-gpu-stats
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set +e

        NAMESPACE="$(params.namespace)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        LOG_DIR="${RESULTS_DIR}/gpu_logs"
        SENTINEL="${RESULTS_DIR}/gpu_stream_done"
        INTERVAL="$(params.intervalSeconds)"
        DCGM_NS="$(params.dcgmNamespace)"
        DCGM_SELECTOR="$(params.dcgmSelector)"
        DCGM_CONTAINER="$(params.dcgmContainer)"
        VLLM_CONTAINER="$(params.vllmContainer)"

        # Every K iterations of the sampling loop, re-evaluate exit conditions
        # and the (node -> DCGM pod) map. K=6 at the default INTERVAL=10s means
        # we re-check once per minute. The re-resolve block detects:
        #   - all vLLM pods gone (workload finished without sentinel)
        #   - vLLM node-set change (pod rescheduled)
        #   - DCGM pod restart on a stable node set (the build_node_dcgm call
        #     runs unconditionally so this case is covered too)
        RE_RESOLVE_EVERY=6

        # Phase 0 — Validation
        if ! echo "${INTERVAL}" | grep -qE '^[1-9][0-9]{0,2}$' \
             || [ "${INTERVAL}" -lt 1 ] || [ "${INTERVAL}" -gt 300 ]; then
          echo "ERROR: intervalSeconds must be integer 1-300, got: ${INTERVAL}"
          exit 0
        fi

        mkdir -p "${LOG_DIR}"
        rm -f "${SENTINEL}"

        # ────────────────────────────────────────────────────────────
        # Phase 1 — vLLM pod discovery
        # ────────────────────────────────────────────────────────────
        # Set-based selector matches collect-results: any pod with role
        # in (decode, prefill). Single-quoted in the kubectl arg so the
        # spaces and parens reach kubectl intact.
        discover_vllm_pods() {
          kubectl get pods -n "${NAMESPACE}" \
            -l 'llm-d.ai/role in (decode,prefill)' \
            --field-selector=status.phase=Running \
            --no-headers -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName 2>/dev/null
        }

        echo "Waiting for running vLLM pods (-l 'llm-d.ai/role in (decode,prefill)')"
        PODS_NODES=""
        i=0
        while [ $i -lt 20 ]; do
          PODS_NODES=$(discover_vllm_pods)
          if [ -n "${PODS_NODES}" ]; then break; fi
          i=$((i+1))
          sleep 3
        done

        if [ -z "${PODS_NODES}" ]; then
          echo "WARNING: No running vLLM pods found after 60s, skipping."
          exit 0
        fi

        # Extract pod list and unique node list
        PODS=$(echo "${PODS_NODES}" | awk '{print $1}' | grep -v '^$')
        NODES=$(echo "${PODS_NODES}" | awk '{print $2}' | sort -u | grep -v '^$')

        echo "Discovered vLLM pods:"
        echo "${PODS_NODES}" | sed 's/^/  /'

        # ────────────────────────────────────────────────────────────
        # Phase 1.5 — Pod -> GPU UUID snapshot (best-effort)
        # ────────────────────────────────────────────────────────────
        # Phase 1.5 depends on the vLLM container image having `nvidia-smi`
        # on PATH. Stock vLLM (vllm/vllm-openai:*) is CUDA-based and ships
        # nvidia-smi, so this works out of the box. Slim, distroless, or
        # custom-built images may not — in that case `nvidia-smi -L` returns
        # non-zero and we skip the .uuids file for that pod. Downstream
        # analysis falls back to pod->node + the per-node nvidia-smi stream,
        # which is coarser but still useful.
        #
        # If pods are rescheduled mid-run, the snapshot goes stale. Re-running
        # the exec when the pod set changes is a future enhancement.
        echo "Phase 1.5 — capturing pod -> GPU UUID snapshot"
        for pod in ${PODS}; do
          out=$(kubectl exec -n "${NAMESPACE}" "${pod}" -c "${VLLM_CONTAINER}" \
                  -- nvidia-smi -L 2>&1)
          rc=$?
          if [ ${rc} -eq 0 ] && [ -n "${out}" ]; then
            printf '%s\n' "${out}" > "${LOG_DIR}/${pod}.uuids"
            n_gpu=$(printf '%s\n' "${out}" | wc -l | tr -d ' ')
            echo "  ${pod}: ${n_gpu} GPU(s)"
          else
            echo "  WARNING: ${pod}: nvidia-smi -L failed (image may lack the binary), skipping .uuids"
          fi
        done

        # ────────────────────────────────────────────────────────────
        # Phase 2 — DCGM resolution per node
        # ────────────────────────────────────────────────────────────
        # Selector fallback chain:
        #   1. ${DCGM_SELECTOR} (default app.kubernetes.io/name=nvidia-dcgm-exporter)
        #   2. app=nvidia-dcgm (older operator versions)
        #   3. substring match on pod name containing "nvidia-dcgm"
        # If DCGM_NS is empty we search across all namespaces; if not, we pin.
        resolve_dcgm_for_node() {
          rd_node="$1"
          for sel in "${DCGM_SELECTOR}" "app=nvidia-dcgm"; do
            if [ -n "${DCGM_NS}" ]; then
              rd_out=$(kubectl get pods -n "${DCGM_NS}" \
                -l "${sel}" \
                --field-selector="spec.nodeName=${rd_node},status.phase=Running" \
                --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name 2>/dev/null)
            else
              rd_out=$(kubectl get pods -A \
                -l "${sel}" \
                --field-selector="spec.nodeName=${rd_node},status.phase=Running" \
                --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name 2>/dev/null)
            fi
            if [ -n "${rd_out}" ]; then
              echo "${rd_out}" | head -1
              return 0
            fi
          done
          # Substring fallback
          if [ -n "${DCGM_NS}" ]; then
            kubectl get pods -n "${DCGM_NS}" \
              --field-selector="spec.nodeName=${rd_node},status.phase=Running" \
              --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name 2>/dev/null \
              | grep nvidia-dcgm | head -1
          else
            kubectl get pods -A \
              --field-selector="spec.nodeName=${rd_node},status.phase=Running" \
              --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name 2>/dev/null \
              | grep nvidia-dcgm | head -1
          fi
        }

        # NODE_DCGM is a space-separated list of "node|ns|pod" tuples. None
        # of those fields can contain spaces or pipes in a valid k8s setup,
        # so the simple split with `cut` is unambiguous.
        #
        # Side effect: caches the auto-discovered DCGM namespace into DCGM_NS
        # the first time a tuple is built, so subsequent re-resolves skip the
        # cluster-wide `-A` search.
        build_node_dcgm() {
          BND_OUT=""
          for bnd_node in $1; do
            bnd_r=$(resolve_dcgm_for_node "${bnd_node}")
            if [ -z "${bnd_r}" ]; then
              echo "  WARNING: no DCGM pod on node ${bnd_node}, skipping"
              continue
            fi
            bnd_ns=$(echo "${bnd_r}" | awk '{print $1}')
            bnd_pod=$(echo "${bnd_r}" | awk '{print $2}')
            echo "  ${bnd_node} -> ${bnd_ns}/${bnd_pod}"
            BND_OUT="${BND_OUT} ${bnd_node}|${bnd_ns}|${bnd_pod}"
            if [ -z "${DCGM_NS}" ]; then
              DCGM_NS="${bnd_ns}"
              echo "  cached DCGM namespace: ${DCGM_NS}"
            fi
          done
          NODE_DCGM="${BND_OUT}"
        }

        echo "Phase 2 — resolving DCGM pods per node"
        build_node_dcgm "${NODES}"

        if [ -z "${NODE_DCGM}" ]; then
          echo "WARNING: no DCGM pods resolved on any node (CPU-only cluster?), exiting."
          exit 0
        fi

        # ────────────────────────────────────────────────────────────
        # Phase 3 — Sampling loop (with Phase 4 sentinel polling)
        # ────────────────────────────────────────────────────────────
        # Every ${INTERVAL}s, exec into each DCGM pod and append a
        # timestamped nvidia-smi block to ${LOG_DIR}/${node}.log. The loop
        # exits when collect-results writes ${SENTINEL}, or when all DCGM
        # pods stop being resolvable.
        echo "Phase 3 — sampling every ${INTERVAL}s; sentinel: ${SENTINEL}"
        iter=0
        while true; do
          if [ -f "${SENTINEL}" ]; then
            echo "Sentinel found, stopping samples."
            break
          fi

          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for entry in ${NODE_DCGM}; do
            ne_node=$(echo "${entry}" | cut -d'|' -f1)
            ne_ns=$(echo "${entry}"   | cut -d'|' -f2)
            ne_pod=$(echo "${entry}"  | cut -d'|' -f3)
            {
              echo "===== ${ts} ${ne_node} (${ne_ns}/${ne_pod}) ====="
              kubectl exec -n "${ne_ns}" "${ne_pod}" -c "${DCGM_CONTAINER}" \
                -- nvidia-smi 2>&1
              echo ""
            } >> "${LOG_DIR}/${ne_node}.log"
          done

          iter=$((iter+1))
          if [ $((iter % RE_RESOLVE_EVERY)) -eq 0 ]; then
            # Independent exit conditions, evaluated every K iterations:
            #   (a) no running vLLM pods remain (workload finished cleanly
            #       without writing the sentinel — mirrors stream-epp-logs)
            #   (b) no DCGM pod resolvable on any target node (issue Phase 4)
            # Both must be checked unconditionally; they are not nested.
            NEW_PN=$(discover_vllm_pods)
            if [ -z "${NEW_PN}" ]; then
              echo "No running vLLM pods remain, stopping samples."
              break
            fi
            NEW_NODES=$(echo "${NEW_PN}" | awk '{print $2}' | sort -u | grep -v '^$')
            if [ "${NEW_NODES}" != "${NODES}" ]; then
              echo "Node set changed; updating target nodes"
              NODES="${NEW_NODES}"
            fi
            # Always re-build NODE_DCGM so a DCGM-pod restart on a stable node
            # set is detected. Per-node WARNINGs come from build_node_dcgm.
            build_node_dcgm "${NODES}"
            if [ -z "${NODE_DCGM}" ]; then
              echo "All target nodes lost their DCGM pod, stopping samples."
              break
            fi
          fi

          # Sleep in 1s slices so the sentinel takes effect promptly.
          s=0
          while [ ${s} -lt "${INTERVAL}" ]; do
            [ -f "${SENTINEL}" ] && break
            sleep 1
            s=$((s+1))
          done
        done

        echo "GPU stats sampling complete for $(params.resultsDir)"
