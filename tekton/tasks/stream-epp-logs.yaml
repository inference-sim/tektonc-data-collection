# tektonc-data-collection/tekton/tasks/stream-epp-logs.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: stream-epp-logs
spec:
  description: >-
    Streams EPP pod logs to data-pvc throughout a workload run, splitting
    output into time-bucketed log files under resultsDir/epp_logs/.
    Runs in parallel with run-workload; exits when collect-results writes
    resultsDir/epp_stream_done. Non-fatal: failures do not fail the pipeline.

    Pod discovery uses the `inferencepool` label applied by the
    inferencepool Helm chart (same convention as collect-results).

  workspaces:
    - name: data
      description: "Shared PVC (data-pvc)"

  params:
    - { name: namespace,       type: string }
    - { name: resultsDir,      type: string }
    - { name: containerName,   type: string, default: "epp" }
    - { name: windowMinutes,   type: string, default: "2" }

  steps:
    - name: stream-epp-pod-logs
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set +e

        NAMESPACE="$(params.namespace)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        LOG_DIR="${RESULTS_DIR}/epp_logs"
        SENTINEL="${RESULTS_DIR}/epp_stream_done"
        WINDOW="$(params.windowMinutes)"

        # Phase 0 — Validation
        if ! echo "${WINDOW}" | grep -qE '^[1-9][0-9]?$' || [ "${WINDOW}" -gt 60 ]; then
          echo "ERROR: windowMinutes must be integer 1-60, got: ${WINDOW}"
          exit 0
        fi

        # Phase 1 — Pod discovery
        # Try llm-d-router-gateway label first (post-#1455 migration); fall back to
        # the legacy inferencepool chart label for older deployments.
        echo "Waiting for running EPP pod (labels: llm-d.ai/igw-mode=llm-d-router-gateway, then inferencepool)"
        EPP_PODS=""
        EPP_SELECTOR=""
        i=0
        while [ $i -lt 20 ]; do
          EPP_PODS=$(kubectl get pods -n "${NAMESPACE}" \
            -l "llm-d.ai/igw-mode=llm-d-router-gateway" \
            --field-selector=status.phase=Running \
            --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)
          if [ -n "${EPP_PODS}" ]; then
            EPP_SELECTOR="llm-d.ai/igw-mode=llm-d-router-gateway"
            break
          fi
          EPP_PODS=$(kubectl get pods -n "${NAMESPACE}" \
            -l "inferencepool" \
            --field-selector=status.phase=Running \
            --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)
          if [ -n "${EPP_PODS}" ]; then
            EPP_SELECTOR="inferencepool"
            break
          fi
          i=$((i+1))
          sleep 3
        done

        if [ -z "${EPP_PODS}" ]; then
          echo "WARNING: No running EPP pods found (tried: llm-d.ai/igw-mode=llm-d-router-gateway, inferencepool) after 60s, skipping."
          exit 0
        fi
        echo "Discovered EPP pods via selector: ${EPP_SELECTOR}"

        # Phase 2 — Streaming
        # Split kubectl+awk into two jobs via a FIFO so both PIDs are known.
        # A pipelined `kubectl logs -f` blocked in read() with nothing to
        # write never receives SIGPIPE when awk dies, so cleanup would hang
        # in `wait` until the TaskRun timeout — see #57.
        rm -f "${SENTINEL}"
        mkdir -p "${LOG_DIR}"
        FIFOS=""
        AWK_PIDS=""
        KUBECTL_PIDS=""
        for pod in ${EPP_PODS}; do
          echo "Streaming EPP logs: ${pod} -> ${LOG_DIR}/"
          FIFO="/tmp/epp-${pod}.fifo"
          rm -f "${FIFO}"
          mkfifo "${FIFO}"
          FIFOS="${FIFOS} ${FIFO}"
          awk -v outdir="${LOG_DIR}" -v pod="${pod}" -v win="${WINDOW}" '
            {
              split($1, dt, "T")
              split(dt[2], tm, ":")
              hour = tm[1]
              min  = int(tm[2])
              bucket = int(min / win) * win
              fname = sprintf("%s/%s_%s%02d.log", outdir, pod, hour, bucket)
              out = ""
              for (i = 2; i <= NF; i++) out = out (i > 2 ? " " : "") $i
              print out >> fname
              fflush(fname)
            }
          ' < "${FIFO}" &
          AWK_PIDS="${AWK_PIDS} $!"
          kubectl logs --follow --timestamps=true "${pod}" -n "${NAMESPACE}" -c "$(params.containerName)" > "${FIFO}" &
          KUBECTL_PIDS="${KUBECTL_PIDS} $!"
        done
        PIDS="${AWK_PIDS} ${KUBECTL_PIDS}"

        # Phase 3 — Sentinel poll
        # Exits when any of these is true:
        #   (a) collect-results writes the sentinel file (normal completion)
        #   (b) no running EPP pods remain (pod deleted, workload done)
        #   (c) all kubectl/awk background processes have already exited
        echo "Streaming started. Polling for sentinel: ${SENTINEL}"
        while true; do
          if [ -f "${SENTINEL}" ]; then
            echo "Sentinel found, stopping streams."
            break
          fi
          # Use the same selector that found pods at startup so the alive-poll
          # set matches the streaming set. Without ${EPP_SELECTOR} pinned here,
          # a deployment using llm-d-router-gateway labels would always look
          # "no pods alive" under the legacy inferencepool selector and exit
          # the loop immediately.
          EPP_ALIVE=$(kubectl get pods -n "${NAMESPACE}" \
            -l "${EPP_SELECTOR}" \
            --field-selector=status.phase=Running \
            --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)
          if [ -z "${EPP_ALIVE}" ]; then
            echo "No running EPP pods remain, stopping streams."
            break
          fi
          ALL_DEAD=true
          for pid in ${PIDS}; do
            if kill -0 "${pid}" 2>/dev/null; then
              ALL_DEAD=false
              break
            fi
          done
          if ${ALL_DEAD}; then
            echo "All EPP stream processes exited."
            break
          fi
          sleep 5
        done

        kill ${PIDS} 2>/dev/null || true
        wait 2>/dev/null || true
        rm -f ${FIFOS}
        echo "EPP log streaming complete for $(params.resultsDir)"
