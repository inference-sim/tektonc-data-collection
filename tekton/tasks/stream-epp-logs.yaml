# tektonc-data-collection/tekton/tasks/stream-epp-logs.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: stream-epp-logs
spec:
  description: >-
    Streams EPP pod logs to data-pvc throughout a workload run, splitting
    output into time-bucketed log files under resultsDir/epp_logs/.
    Runs in parallel with run-workload; exits when collect-results writes
    resultsDir/epp_stream_done. Non-fatal: failures do not fail the pipeline.

    Pod discovery uses the `inferencepool` label applied by the
    inferencepool Helm chart (same convention as collect-results).

  workspaces:
    - name: data
      description: "Shared PVC (data-pvc)"

  params:
    - { name: namespace,       type: string }
    - { name: resultsDir,      type: string }
    - { name: containerName,   type: string, default: "epp" }
    - { name: windowMinutes,   type: string, default: "2" }

  steps:
    - name: stream-epp-pod-logs
      image: alpine/kubectl:1.34.1
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set +e

        NAMESPACE="$(params.namespace)"
        RESULTS_DIR="/workspace/data/$(params.resultsDir)"
        LOG_DIR="${RESULTS_DIR}/epp_logs"
        SENTINEL="${RESULTS_DIR}/epp_stream_done"
        WINDOW="$(params.windowMinutes)"

        # Phase 0 — Validation
        if ! echo "${WINDOW}" | grep -qE '^[1-9][0-9]?$' || [ "${WINDOW}" -gt 60 ]; then
          echo "ERROR: windowMinutes must be integer 1-60, got: ${WINDOW}"
          exit 0
        fi

        # Phase 1 — Pod discovery (inferencepool chart label, matches collect-results)
        echo "Waiting for running EPP pod (label: inferencepool)"
        EPP_PODS=""
        i=0
        while [ $i -lt 20 ]; do
          EPP_PODS=$(kubectl get pods -n "${NAMESPACE}" \
            -l "inferencepool" \
            --field-selector=status.phase=Running \
            --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)
          [ -n "${EPP_PODS}" ] && break
          i=$((i+1))
          sleep 3
        done

        if [ -z "${EPP_PODS}" ]; then
          echo "WARNING: No running EPP pods found (label: inferencepool) after 60s, skipping."
          exit 0
        fi

        # Phase 2 — Streaming
        rm -f "${SENTINEL}"
        mkdir -p "${LOG_DIR}"
        PIDS=""
        for pod in ${EPP_PODS}; do
          echo "Streaming EPP logs: ${pod} -> ${LOG_DIR}/"
          kubectl logs --follow --timestamps=true "${pod}" -n "${NAMESPACE}" -c "$(params.containerName)" \
            | awk -v outdir="${LOG_DIR}" -v pod="${pod}" -v win="${WINDOW}" '
              {
                split($1, dt, "T")
                split(dt[2], tm, ":")
                hour = tm[1]
                min  = int(tm[2])
                bucket = int(min / win) * win
                fname = sprintf("%s/%s_%s%02d.log", outdir, pod, hour, bucket)
                out = ""
                for (i = 2; i <= NF; i++) out = out (i > 2 ? " " : "") $i
                print out >> fname
                fflush(fname)
              }
            ' &
          # $! is the awk PID (rightmost in pipe). Killing awk breaks the pipe;
          # kubectl receives SIGPIPE and exits cleanly.
          PIDS="${PIDS} $!"
        done

        # Phase 3 — Sentinel poll
        # Exits when any of these is true:
        #   (a) collect-results writes the sentinel file (normal completion)
        #   (b) no running EPP pods remain (pod deleted, workload done)
        #   (c) all kubectl/awk background processes have already exited
        echo "Streaming started. Polling for sentinel: ${SENTINEL}"
        while true; do
          if [ -f "${SENTINEL}" ]; then
            echo "Sentinel found, stopping streams."
            break
          fi
          EPP_ALIVE=$(kubectl get pods -n "${NAMESPACE}" \
            -l "inferencepool" \
            --field-selector=status.phase=Running \
            --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null || true)
          if [ -z "${EPP_ALIVE}" ]; then
            echo "No running EPP pods remain, stopping streams."
            break
          fi
          ALL_DEAD=true
          for pid in ${PIDS}; do
            if kill -0 "${pid}" 2>/dev/null; then
              ALL_DEAD=false
              break
            fi
          done
          if ${ALL_DEAD}; then
            echo "All EPP stream processes exited."
            break
          fi
          sleep 5
        done

        kill ${PIDS} 2>/dev/null || true
        wait ${PIDS} 2>/dev/null || true
        echo "EPP log streaming complete for $(params.resultsDir)"
