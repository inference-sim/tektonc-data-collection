# tektonc-data-collection/tekton/roles-ns.yaml
#
# Namespaced base for the helm-installer SA. Pair with roles-cluster.yaml
# (optional cluster augment) when cluster-admin grants are available.
#
# Sized per the audit in inference-sim/tektonc-data-collection#48: every rule
# below is justified by an in-namespace task or installed manifest. Cluster-
# scoped and cross-namespace grants are NOT in this file — they live in
# roles-cluster.yaml as an optional augment.
#
# Applying this file alone is sufficient to run a non-admin install
# (`--non-admin=true`) end-to-end. Without the cluster augment:
#   - stream-gpu-stats Phase 2/2.5/3 (cross-ns DCGM exec) degrades silently
#     — Phase 1.5 in-namespace exec still works (.uuids files still produced)
#   - llm-d-benchmark auto-discovery (kubectl get nodes) is unavailable;
#     callers must export GPU/node counts directly
#   - admin-only stack installs (cluster-monitoring-config patch,
#     ClusterRole/CRD/Namespace creates) are skipped — already gated behind
#     `--non-admin`
#
# Notes on the post-#48 split:
#   - `namespaces` and `nodes` are cluster-scoped; they belong only in
#     roles-cluster.yaml. Listing them in a Role is a no-op for access but
#     triggers the RBAC escalation check on apply, which fails for users
#     who don't hold those verbs cluster-scoped.
#   - `securitycontextconstraints use` is conferred by the SCC RoleBindings
#     below (canonical OpenShift pattern); the in-Role rule was redundant.
#   - `helm-access-binding` has `helm-installer` as its only subject (per
#     #47). The SCC RoleBindings keep `default` as a subject so pods that
#     don't pin a `serviceAccountName` can still start. See the SCC
#     binding comment below; tradeoff documented on #47.
#   - `helm-installer-privileged-scc` was previously applied imperatively
#     by consumers (e.g. sim2real's setup.py via `oc adm policy
#     add-scc-to-user`). Carrying it here makes the YAML self-sufficient.
#
# What this bundle does NOT cover (handled separately by consumers):
#   - tekton/rbac/sim2real-runner.yaml
#   - sim2real's pipeline/rbac/sim2real-runner-ns.yaml
#   - sim2real's pipeline/rbac/sim2real-runner-cluster.yaml

apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-installer
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-access
  namespace: ${NAMESPACE}
rules:
# Core in-namespace resources.
- apiGroups: [""]
  resources: ["pods", "services", "secrets", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# pods/exec — in-namespace only. stream-gpu-stats Phase 1.5 execs into the
# vLLM pod for `nvidia-smi -L`. Cross-ns case (DCGM exporter) is in the
# cluster augment.
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create", "get"]
- apiGroups: [""]
  resources: ["pods/attach"]
  verbs: ["create"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Namespaced rbac for scenario extraObjects (e.g. Role + RoleBinding for
# the gaie-epp ServiceAccount). ClusterRole/ClusterRoleBinding live in
# the cluster augment.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "httproutes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["gateway.kgateway.dev"]
  resources: ["gatewayparameters"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["llm-d.ai"]
  resources: ["inferenceobjectives", "inferencemodelrewrites",
              "inferenceobjectives/status", "inferencemodelrewrites/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["inference.networking.x-k8s.io"]
  resources: ["inferencepools", "inferencemodels", "inferenceobjectives", "inferencemodelrewrites",
              "inferenceobjectives/status", "inferencemodelrewrites/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["inference.networking.k8s.io"]
  resources: ["inferencepools"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.istio.io"]
  resources: ["destinationrules", "envoyfilters"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["telemetry.istio.io"]
  resources: ["telemetries"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["tekton.dev"]
  resources: ["pipelineruns"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-access-binding
  namespace: ${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: helm-installer
  namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: helm-access
  apiGroup: rbac.authorization.k8s.io
---
# OpenShift SCC bindings. Each RoleBinding references a pre-existing
# system:openshift:scc:<name> ClusterRole (no creation needed). On
# non-OpenShift K8s, the ClusterRole is absent and the binding is a
# no-op — safe to leave in place.
#
# `default` is included as a subject because helm-installed Deployments
# that don't pin `serviceAccountName` fall back to `default`, and on
# OpenShift those pods still need SCC `use` to start. The blast radius
# is namespace-scoped: every pod in this namespace gains `use` on these
# SCCs. If your charts pin SAs, drop the `default` subject for tighter
# scoping. See the comment thread on #47.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-installer-restricted-scc
  namespace: ${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: helm-installer
  namespace: ${NAMESPACE}
- kind: ServiceAccount
  name: default
  namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:restricted
  apiGroup: rbac.authorization.k8s.io
---
# anyuid — vLLM container images commonly run as a fixed non-zero uid;
# the default OpenShift `restricted` SCC randomizes the uid which can
# break image expectations. anyuid lets the deployment keep its image's
# declared uid. Drop this binding if your images are restricted-clean.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-installer-anyuid-scc
  namespace: ${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: helm-installer
  namespace: ${NAMESPACE}
- kind: ServiceAccount
  name: default
  namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:anyuid
  apiGroup: rbac.authorization.k8s.io
---
# privileged — sim2real's setup.py applies this imperatively today
# (`oc adm policy add-scc-to-user privileged -z helm-installer`).
# Carrying it here makes the bundle self-contained: anyone applying the
# YAML directly (without setup.py) gets the same SCC posture. `default`
# is intentionally NOT a subject — privileged is much broader than
# anyuid and should not blanket every pod in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-installer-privileged-scc
  namespace: ${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: helm-installer
  namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:privileged
  apiGroup: rbac.authorization.k8s.io
