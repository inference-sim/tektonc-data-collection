# ServiceAccount, Role, and RoleBinding for run-sub-pipeline Task pods
# and the sim2real orchestrator Job.
# Task pods and orchestrator use this SA to manage PipelineRuns and
# ConfigMaps in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sim2real-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sim2real-pipeline-runner
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "watch", "list", "delete", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sim2real-pipeline-runner
subjects:
  - kind: ServiceAccount
    name: sim2real-runner
roleRef:
  kind: Role
  name: sim2real-pipeline-runner
  apiGroup: rbac.authorization.k8s.io
