nemotron-smoke:
  spec: blis_native

  # Minimal ORC smoke workload for Nemotron 3.5 Lightning (or any model).
  # PURPOSE: Smallest useful observe run — a fixed, bounded burst of requests
  # from a single open-loop Poisson source with simple fixed-length prompts.
  # SHAPE: 200 total requests (generation stops at num_requests), warmup is
  # applied by orc-observe.yaml (--warmup-requests 50, hardcoded). At ~2 req/s
  # the 200 requests arrive over ~100s; the 1500s horizon is a safe upper bound.
  # RUN WITH: 1 instance (tp=1, dp=null). harness: orc only.
  blis:
    version: "2"
    seed: 42
    category: language
    aggregate_rate: 2.0          # 1 client, Poisson, ~2 req/s
    num_requests: 200            # fixed TOTAL request count (bounds generation)
    clients:
      - id: "single-client"
        slo_class: "standard"
        rate_fraction: 1.0        # one client takes 100% of aggregate_rate
        streaming: true
        arrival:
          process: poisson
        input_distribution:
          type: constant          # simple fixed-length prompts
          params:
            value: 512
        output_distribution:
          type: constant
          params:
            value: 128

agentic-multitier:
  spec: blis_native

  # Multi-tier KV offload demonstration (GPU -> CPU -> disk) with FETCH/read-back.
  # 40 "agents" = 40 distinct 6000-tok shared prefixes (system prompt + tool defs).
  # WRITES: 40-prefix working set (~37 GiB) >> GPU+CPU (~8-9 prefixes @ gpu_mem 0.45 +
  # 2 GiB CPU) -> continuous GPU->CPU->disk spill (write-through).
  # READS (the point): multi-turn (6 rounds, 20s think, accumulate, single_session).
  # During each 20s think-gap ~240 requests run (12/s) touching all 40 agents, so a
  # paused session's fixed 6000-tok prefix is evicted from the ~8-prefix cache before
  # its next turn; rounds 1-5 re-attend the SAME prefix -> GPU miss + CPU miss ->
  # DISK FETCH. ~30k disk reads (6000 sessions x 5 revisits).
  # PAIR WITH: experiments.json exp6 (gpu_mem 0.45, max_model_len 12288,
  # TieringOffloadingSpec + fs secondary tier, cpu_bytes_to_use 2 GiB, scrape_kv_metrics).
  blis:
    version: "2"
    seed: 42
    category: language
    aggregate_rate: 12.0
    num_requests: 6000
    clients:
      - id: "agent-00"
        slo_class: "standard"
        rate_fraction: 0.025
        streaming: true
        arrival:
          process: poisson
        prefix_group: "agent-00-sysprompt"
        prefix_length: 6000
        input_distribution:
          type: constant
          params:
            value: 400
        output_distribution:
          type: constant
          params:
            value: 600
        reasoning:
          reason_ratio_distribution:
            type: constant
            params:
              value: 0.0
          multi_turn:
            max_rounds: 6
            think_time_us: 20000000
            context_growth: "accumulate"
            single_session: true
      - id: "agent-01"
        slo_class: "standard"
        rate_fraction: 0.025
        streaming: true
        arrival:
          process: poisson
