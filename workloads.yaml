#
# For ORC-only workloads using BLIS-specific features, use spec: blis_native.
# See WORKLOADS.md for full documentation.
#
# Example: Multi-tier workload with SLO classes
# ----------------------------------------------
# multi-tier:
#   spec: blis_native
#   blis:
#     aggregate_rate: 100.0
#     clients:
#       - id: "critical-tier"
#         rate_fraction: 0.3
#         slo_class: "critical"
#         arrival:
#           process: poisson
#         input_distribution:
#           type: gaussian
#           params: {mean: 512, stddev: 128, min: 64, max: 2048}
#         output_distribution:
#           type: gaussian
#           params: {mean: 256, stddev: 64, min: 32, max: 1024}
#       - id: "standard-tier"
#         rate_fraction: 0.5
#         slo_class: "standard"
#         arrival: {process: poisson}
#         input_distribution: {...}
#         output_distribution: {...}
#       - id: "batch-tier"
#         rate_fraction: 0.2
#         slo_class: "batch"
#         arrival: {process: constant}
#         input_distribution: {...}
#         output_distribution: {...}
